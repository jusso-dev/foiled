      parameters:
        - { $ref: "#/components/parameters/TaxiiCollectionId" }
      responses:
        "200":
          description: The collection.
          content:
            application/taxii+json;version=2.1:
              schema: { $ref: "#/components/schemas/TaxiiCollection" }
        "401": { $ref: "#/components/responses/TaxiiError" }
        "403": { $ref: "#/components/responses/TaxiiError" }
        "404": { $ref: "#/components/responses/TaxiiError" }
        "406": { $ref: "#/components/responses/TaxiiError" }

  /taxii2/foiled/collections/{collection_id}/objects/:
    get:
      tags: [taxii]
      operationId: taxiiObjects
      summary: TAXII 2.1 objects
      description: |
        Stored object versions from the materialised log, the latest
        version of each object by default (`match[version]`: a comma list
        of `last`, `first`, `all` and exact versions, matching any of them).
        Nothing is rebuilt on a request.
        Rows sort by `date_added`, then id and version; every append gets
        a `date_added` after every row before it, so paging never skips or
        repeats a row, and an id and version always name the same content.
        `added_after` is exclusive. Pages hold at most `limit` objects
        (default 100, at most 1000); follow `next` while `more` is true.
        `X-TAXII-Date-Added-First` and `X-TAXII-Date-Added-Last` describe
        the page.
      x-foiled-status: implemented
      x-foiled-store: postgres
      x-foiled-scopes: [exports:read]
      parameters:
        - { $ref: "#/components/parameters/TaxiiCollectionId" }
        - { $ref: "#/components/parameters/TaxiiAddedAfter" }
        - { $ref: "#/components/parameters/TaxiiLimit" }
        - { $ref: "#/components/parameters/TaxiiNext" }
        - { name: "match[id]", in: query, schema: { type: string } }
        - { name: "match[type]", in: query, schema: { type: string } }
        - { name: "match[version]", in: query, schema: { type: string } }
        - { name: "match[spec_version]", in: query, schema: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/TaxiiEnvelope" }
        "400": { $ref: "#/components/responses/TaxiiError" }
        "401": { $ref: "#/components/responses/TaxiiError" }
        "403": { $ref: "#/components/responses/TaxiiError" }
        "404": { $ref: "#/components/responses/TaxiiError" }
        "406": { $ref: "#/components/responses/TaxiiError" }

  /taxii2/foiled/collections/{collection_id}/objects/{object_id}/:
    get:
      tags: [taxii]
      operationId: taxiiObject
      summary: TAXII 2.1 object by id
      x-foiled-status: implemented
      x-foiled-store: postgres
      x-foiled-scopes: [exports:read]
      parameters:
        - { $ref: "#/components/parameters/TaxiiCollectionId" }
        - { name: object_id, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/TaxiiAddedAfter" }
        - { $ref: "#/components/parameters/TaxiiLimit" }
        - { $ref: "#/components/parameters/TaxiiNext" }
        - { name: "match[version]", in: query, schema: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/TaxiiEnvelope" }
        "401": { $ref: "#/components/responses/TaxiiError" }
        "403": { $ref: "#/components/responses/TaxiiError" }
        "404": { $ref: "#/components/responses/TaxiiError" }
        "406": { $ref: "#/components/responses/TaxiiError" }

  /taxii2/foiled/collections/{collection_id}/objects/{object_id}/versions/:
    get:
      tags: [taxii]
      operationId: taxiiObjectVersions
      summary: TAXII 2.1 object versions
      description: Every stored version of one object, oldest first.
      x-foiled-status: implemented
      x-foiled-store: postgres
      x-foiled-scopes: [exports:read]
      parameters:
        - { $ref: "#/components/parameters/TaxiiCollectionId" }
        - { name: object_id, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/TaxiiAddedAfter" }
        - { $ref: "#/components/parameters/TaxiiLimit" }
        - { $ref: "#/components/parameters/TaxiiNext" }
      responses:
        "200":
          description: The versions.
          content:
            application/taxii+json;version=2.1:
              schema:
                type: object
                required: [more]
                properties:
                  more: { type: boolean }
                  next: { type: string }
                  versions: { type: array, items: { type: string } }
        "400": { $ref: "#/components/responses/TaxiiError" }
        "401": { $ref: "#/components/responses/TaxiiError" }
        "403": { $ref: "#/components/responses/TaxiiError" }
        "404": { $ref: "#/components/responses/TaxiiError" }
        "406": { $ref: "#/components/responses/TaxiiError" }

  /v0/taxii/materialise:
    post:
      tags: [taxii]
      operationId: materialiseTaxii
      summary: Write new STIX object versions to the TAXII log now
      description: |
        Runs the materialiser for the caller's tenant: the published view
        (publishable only, TLP:AMBER) of the last 7 UTC days, built day by
        day and staged, then published in reference order: indicators,
        sightings, observables and malware merged over every day's
        contribution, so they never depend on which day ran last. A
        version is appended only for content an object does not already
        have as its head. Objects whose evidence is older than the attempt
        TTL are purged (#16). A run does a bounded amount of work; with
        `incomplete: true` the next run continues from the stored progress.
        One run per tenant at a time: while the scheduled run or another
        request holds the tenant, this returns 409. Audited as
        `taxii.materialise`.
      x-foiled-status: implemented
      x-foiled-store: postgres
      x-foiled-scopes: [admin]
      responses:
        "200":
          description: What the run did.
          content:
            application/json:
              schema:
                type: object
                required: [days_written, days_skipped, parts, chunks, versions_written, unchanged, revoked, reissued, purged, incomplete]
                properties:
                  days_written: { type: integer }
                  days_skipped: { type: integer }
                  parts: { type: integer }
                  chunks: { type: integer }
                  versions_written: { type: integer }
                  unchanged: { type: integer }
                  revoked: { type: integer }
                  reissued: { type: integer }
                  purged: { type: integer }
                  incomplete: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorised" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /taxii2/foiled/collections/{collection_id}/manifest/:
    get:
      tags: [taxii]
      operationId: taxiiManifest
      summary: TAXII 2.1 manifest
      x-foiled-status: implemented
      x-foiled-store: postgres
      x-foiled-scopes: [exports:read]
      parameters:
        - { $ref: "#/components/parameters/TaxiiCollectionId" }
        - { $ref: "#/components/parameters/TaxiiAddedAfter" }
        - { $ref: "#/components/parameters/TaxiiLimit" }
        - { $ref: "#/components/parameters/TaxiiNext" }
        - { name: "match[id]", in: query, schema: { type: string } }
        - { name: "match[type]", in: query, schema: { type: string } }
      responses:
        "200":
          description: One manifest record per object.
          content:
            application/taxii+json;version=2.1:
              schema:
                type: object
                required: [more]
                properties:
                  more: { type: boolean }
                  next: { type: string }
                  objects:
                    type: array
                    items:
                      type: object
                      required: [id, date_added, version, media_type]
                      properties:
                        id: { type: string }
                        date_added: { type: string }
                        version: { type: string }
                        media_type: { type: string }
        "400": { $ref: "#/components/responses/TaxiiError" }
        "401": { $ref: "#/components/responses/TaxiiError" }
        "403": { $ref: "#/components/responses/TaxiiError" }
        "404": { $ref: "#/components/responses/TaxiiError" }
        "406": { $ref: "#/components/responses/TaxiiError" }

  /v0/alerts:
    get:
      tags: [alerts]
      operationId: listAlerts
      summary: Recent alerts and delivery status
      x-foiled-status: planned
      x-foiled-issue: 15
      x-foiled-store: postgres
      x-foiled-scopes: [alerts:read]
      responses:
        "200": { description: "Alerts." }

  /v0/audit:
    get:
      tags: [audit]
      operationId: listAudit
      summary: Audit log, newest first
      x-foiled-status: implemented
      x-foiled-store: postgres
      x-foiled-scopes: [audit:read]
      parameters:
        - { name: action, in: query, schema: { type: string } }
        - { name: target, in: query, schema: { type: string } }
        - { name: cursor, in: query, schema: { type: string } }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Records.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AuditRecord" }
                  next_cursor: { type: [string, "null"] }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorised" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v0/events:
    get:
      tags: [events]
      operationId: streamEvents
      summary: Live event stream (WebSocket upgrade or SSE)
      description: Served by a Durable Object with hibernating WebSockets. Clients must reconnect and backfill after deploys.
      x-foiled-status: planned
      x-foiled-issue: 14
      x-foiled-store: do
      x-foiled-scopes: [events:read]
      responses:
        "101": { description: "WebSocket upgrade." }
        "200":
          description: Server-sent events.
          content:
            text/event-stream:
              schema: { type: string }

  /v0/mcp:
    post:
      tags: [mcp]
      operationId: mcp
      summary: MCP endpoint (Streamable HTTP, JSON-RPC 2.0)
      description: |
        Model Context Protocol server for agents (#24). One JSON-RPC 2.0
        request or notification per POST; batches are refused. Requests get
        a single `application/json` response, notifications get 202 with no
        body. There is no SSE stream and no session (`GET` and `DELETE`
        answer 405). Serves protocol revisions `2026-07-28` (stateless,
        `server/discover`), `2025-11-25` and `2025-06-18` (`initialize`).
        Methods: `initialize`, `server/discover`, `ping`, `tools/list`,
        `tools/call`. Under `2026-07-28` the `MCP-Protocol-Version`,
        `Mcp-Method` and (for `tools/call`) `Mcp-Name` headers are required.
        Destructive tools ask for the operator's approval through form
        elicitation (`input_required`) when a `2026-07-28` client declares
        that capability.

        The endpoint is a pure client of this API: each tool call is replayed
        against the REST routes with the caller's own token, so their scopes,
        tenancy, rate limits, caps and audit apply. Agent caps from
        `configs/mcp.yaml` apply on top. Every `tools/call` writes one
        `mcp.tool_call` audit record. Tool results put attacker text inside
        nonce-framed, escaped blocks (`../schemas/mcp-tool-result.schema.json`).
        A request with an `Origin` header not in `allowed_origins` gets 403.
      x-foiled-status: implemented
      x-foiled-store: d1
      x-foiled-scopes: [catalogue:read, decoys:read, decoys:write, decoys:elevate, attempts:read, audit:read]
      parameters:
        - name: MCP-Protocol-Version
          in: header
          description: Required on every request except `initialize` and a bare `server/discover` probe. Must match `params._meta` when both are sent.
          schema: { type: string, enum: ["2026-07-28", "2025-11-25", "2025-06-18"] }
        - name: Mcp-Method
          in: header
          description: Required under 2026-07-28. When sent, must equal the body's `method`.
          schema: { type: string }
        - name: Mcp-Name
          in: header
          description: Required on `tools/call` under 2026-07-28. When sent, must equal `params.name`.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JsonRpcRequest" }
            examples:
              call:
                value:
                  jsonrpc: "2.0"
                  id: 1
                  method: tools/call
                  params:
                    name: query_attempts
                    arguments: { src: 203.0.113.66, state: exploit }
      responses:
        "200":
          description: A JSON-RPC response. Tool results carry `structuredContent` in the shape of `mcp-tool-result.schema.json` and the same data framed as text.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JsonRpcResponse" }
        "202":
          description: A notification was accepted. No body.
        "400":
          description: Parse error, batch, missing or unsupported protocol version, or a header that does not match the body.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JsonRpcResponse" }
        "401": { $ref: "#/components/responses/Unauthorised" }
        "403":
          description: Origin not allowed, or a host or sensor credential.
          content:
            application/json:
              schema: {}
        "404":
          description: Unknown method under protocol revision 2026-07-28 (JSON-RPC -32601), or the endpoint is switched off.
          content:
            application/json:
              schema: {}
        "413":
          description: Body over 64 KiB.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JsonRpcResponse" }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: "fo_<id>.<secret>"
      description: |
        Operator and MCP tokens. An `mcp` role token can only hold
        catalogue:read, decoys:read, decoys:write, decoys:elevate,
        attempts:read, audit:read and events:read (#24). Scopes: catalogue:read, decoys:read,
        decoys:write, decoys:elevate, attempts:read, attempts:write,
        campaigns:read, campaigns:write, iocs:read, review:read, review:write,
        review:publish,
        sensors:read, sensors:write, hosts:read, hosts:write, quarantine:read,
        quarantine:download, exports:read, alerts:read, alerts:write,
        audit:read, events:read, admin (implies every operator scope).
    mtls:
      type: mutualTLS
      description: |
        Sandbox hosts (scopes host:lease, host:report, host:ingest,
        host:upload) and edge sensors (sensor:lease, sensor:report,
        sensor:ingest, sensor:upload) on the ingest hostname. Verified by a
        WAF rule and again in the Worker from `cf.tlsClientAuth`; the
        certificate's SHA-256 fingerprint maps to one identity, role and
        tenant in D1. Certificates are issued through `POST /v0/enrol` (#31).

  headers:
    PublicCache:
      description: "public, max-age=60, s-maxage=60 on success; public, max-age=60 on 404; no-store otherwise. Pages are also purged from Cloudflare's cache on publish and withdrawal."
      schema: { type: string }
    EnrichmentUnavailable:
      description: "`unavailable` when the enrichment cache (#11) could not be read. The response is complete otherwise; enrichment context is just missing. Absent when the cache was read."
      schema: { type: string, enum: [unavailable] }

  parameters:
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      schema: { type: string, minLength: 1, maxLength: 128 }
      description: Retries with the same key return the original result.
    DecoyId:
      name: decoy_id
      in: path
      required: true
      schema: { type: string }
    CampaignId:
      name: campaign_id
      in: path
      required: true
      schema: { type: string, pattern: "^cmp_[a-f0-9]{24}$" }
    ActorLinkId:
      name: link_id
      in: path
      required: true
      schema: { type: string, pattern: "^acl_[a-f0-9]{24}$" }
    HostId:
      name: host_id
      in: path
      required: true
      schema: { type: string }
    ReviewItemId:
      name: item_id
      in: path
      required: true
      schema: { type: string, pattern: "^rq_[a-f0-9]{24}$" }
    WriteUpId:
      name: writeup_id
      in: path
      required: true
      schema: { type: string, pattern: "^wu_[a-f0-9]{24}$" }
    RadarDimension:
      name: dimension
      in: query
      schema: { type: string, enum: [cve, technique, campaign, product] }
    AttemptId:
      name: attempt_id
      in: path
      required: true
      schema: { type: string }
    ExportSince:
      name: since
      in: query
      schema: { type: integer }
      description: "Unix ms, inclusive. Default: 7 days before `until` (30 days ago for `fields=source`)."
    ExportUntil:
      name: until
      in: query
      schema: { type: integer }
      description: "Unix ms, exclusive. Default: now. The window is at most 31 days."
    ExportMinConfidence:
      name: min_confidence
      in: query
      schema: { type: integer, minimum: 0, maximum: 100 }
      description: Drop links and IOCs scoring below this. Only narrows; never lets anything below `publish_min` through.
    ExportCatalogueId:
      name: catalogue_id
      in: query
      schema: { type: string, maxLength: 256 }
    ExportState:
      name: state
      in: query
      schema: { type: string, enum: [probe, exploit, post-exploitation] }
    ExportCampaignId:
      name: campaign_id
      in: query
      schema: { type: string, maxLength: 256 }
    ExportDecoyKind:
      name: decoy_kind
      in: query
      schema: { $ref: "#/components/schemas/DecoyKind" }
    ExportIncludeUnreviewed:
      name: include_unreviewed
      in: query
      schema: { type: boolean, default: false }
      description: Include links and IOCs that are not publishable. Requires `review:write`; audited; the export is marked TLP:AMBER+STRICT or stricter and is never public.
    ExportIncludeActors:
      name: include_actors
      in: query
      schema: { type: boolean, default: false }
      description: Include actor links (#29). Only analyst-confirmed links are exported, even with `include_unreviewed`; pending and rejected links never leave. Each becomes an `intrusion-set` (with MITRE's notice marking when it is an ATT&CK group) and a relationship worded "confirmed association", or a MISP `threat-actor` attribute.
    ExportIncludePayloads:
      name: include_payloads
      in: query
      schema: { type: boolean, default: false }
      description: Include request strings taken from stored bodies and request slices (#16). Hashes are always included.
    ExportCursor:
      name: cursor
      in: query
      schema: { type: string, maxLength: 1100 }
      description: The `x-foiled-next-cursor` of a cut export. Reads strictly after that event; pass the same `until` and filters.
    ExportTlp:
      name: tlp
      in: query
      schema: { type: string, enum: [clear, green, amber, amber+strict, red], default: amber }
    TaxiiCollectionId:
      name: collection_id
      in: path
      required: true
      schema: { type: string }
    TaxiiAddedAfter:
      name: added_after
      in: query
      schema: { type: string }
      description: STIX timestamp; only objects added strictly after it.
    TaxiiLimit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
    TaxiiNext:
      name: next
      in: query
      schema: { type: string }
      description: Opaque cursor from the previous page.

  pathItems:
    DecoyAction:
      post:
        tags: [decoys]
        summary: Stop, rotate, reset, mark compromised or destroy a decoy
        description: |
          Writes a host agent job. A `reason` is required and audited. The
          decoy's state must allow the move (`docs/rotation.md`); otherwise
          the refusal is audited and 409 is returned.
        x-foiled-status: implemented
        x-foiled-store: d1
        x-foiled-scopes: [decoys:write]
        parameters:
          - $ref: "#/components/parameters/DecoyId"
          - $ref: "#/components/parameters/IdempotencyKey"
        requestBody:
          required: true
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [reason]
                properties:
                  reason: { $ref: "#/components/schemas/Reason" }
        responses:
          "202":
            description: Job queued.
            content:
              application/json:
                schema: { $ref: "#/components/schemas/JobAccepted" }
          "400": { $ref: "#/components/responses/BadRequest" }
          "401": { $ref: "#/components/responses/Unauthorised" }
          "403": { $ref: "#/components/responses/Forbidden" }
          "404": { $ref: "#/components/responses/NotFound" }
          "409": { $ref: "#/components/responses/Conflict" }
          "429": { $ref: "#/components/responses/RateLimited" }

  responses:
    TaxiiError:
      description: A TAXII 2.1 error message.
      content:
        application/taxii+json;version=2.1:
          schema:
            type: object
            required: [title]
            properties:
              title: { type: string }
              http_status: { type: string }
    TaxiiEnvelope:
      description: A TAXII 2.1 envelope of STIX 2.1 objects.
      content:
        application/taxii+json;version=2.1:
          schema:
            type: object
            required: [more]
            properties:
              more: { type: boolean }
              next: { type: string }
              objects: { type: array, items: { type: object } }
    BadRequest:
      description: Invalid input.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorised:
      description: Missing, invalid, expired or revoked credentials.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: The caller lacks the required scope.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Not found, or not visible to this tenant.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: The current state does not allow this, or the idempotency key was reused.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unprocessable:
      description: Valid JSON that breaks a rule, for example a draft entry without elevation.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: Too many requests in this window.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    ActorProfile:
      type: object
      description: One actor profile from public sources (#29). ATT&CK groups carry MITRE's notice (see the list response); curated reports follow schemas/actor-report.schema.json.
      required: [actor_id, label, label_kind, aliases, techniques, indicators, targeting, geo, sources, example]
      properties:
        actor_id: { type: string, pattern: "^(attack|report):[A-Za-z0-9-]{1,64}$" }
        label: { type: string }
        label_kind: { type: string, enum: [nexus, cluster, named_group] }
        aliases: { type: array, items: { type: string } }
        techniques: { type: array, items: { type: string } }
        indicators:
          type: array
          items:
            type: object
            required: [type, value, source]
            properties:
              type: { type: string, enum: [ip, cidr, domain, url, sha256, asn] }
              value: { type: string }
              source: { type: integer, minimum: 0 }
        targeting:
          type: object
          properties:
            cves: { type: array, items: { type: string } }
            catalogue_ids: { type: array, items: { type: string } }
        geo:
          type: object
          description: Never evidence.
          properties:
            source_countries: { type: array, items: { type: string } }
        sources:
          type: array
          items:
            type: object
            required: [kind, publisher, title, url, published, licence]
            properties:
              kind: { type: string, enum: [attack_group, vendor_report, government_advisory, misp_galaxy] }
              publisher: { type: string }
              title: { type: string }
              url: { type: string }
              published: { type: string }
              retrieved: { type: string }
              sha256: { type: string }
              licence: { type: string }
              licence_url: { type: string }
        attack_version: { type: string }
        example: { type: boolean }
        notes: { type: string }
        weight_pct: { type: integer, description: "Percent of full strength the profile's evidence counts at: 100, or 50 for an import with one publisher." }
        restricted: { type: boolean, description: "A source does not allow redistribution or commercial use: matched and shown, never exported." }
        imported_from: { type: string, description: "The hub an imported profile came from (threatsieve)." }
    WriteUpFields:
      type: object
      additionalProperties: false
      description: Draft fields. Absent fields are left unchanged on edit; null clears the nullable ones.
      properties:
        slug: { type: string, pattern: "^[a-z0-9]+(-[a-z0-9]+)*$", maxLength: 80, description: "Required on create." }
        title: { type: string, maxLength: 160 }
        summary: { type: string, maxLength: 400 }
        body_md: { type: string, maxLength: 65536 }
        tlp: { type: string, enum: [clear, green, amber, amber+strict, red] }
        embargo_until: { type: [integer, "null"] }
        cve_ids: { type: array, maxItems: 50, items: { type: string } }
        technique_ids: { type: array, maxItems: 50, items: { type: string } }
        campaign_ids: { type: array, maxItems: 50, items: { type: string } }
        ioc_ids: { type: array, maxItems: 50, items: { type: string } }
        attempt_ids: { type: array, maxItems: 50, items: { type: string } }
        first_seen: { type: [integer, "null"] }
        redacted_payload: { type: [string, "null"], maxLength: 2000 }
        expected_version: { type: integer, minimum: 1, description: "Required on edit." }
    JsonRpcRequest:
      type: object
      required: [jsonrpc, method]
      properties:
        jsonrpc: { const: "2.0" }
        id: { type: [string, integer], description: "Absent for notifications." }
        method: { type: string, examples: [tools/call] }
        params: { type: object }
    JsonRpcResponse:
      type: object
      required: [jsonrpc]
      properties:
        jsonrpc: { const: "2.0" }
        id: { type: [string, integer] }
        result:
          type: object
          description: For `tools/call`, `content`, `structuredContent` and `isError`.
          properties:
            content: { type: array, items: { type: object } }
            structuredContent: { $ref: "../schemas/mcp-tool-result.schema.json" }
            isError: { type: boolean }
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: integer, examples: [-32602, -32022, -32020] }
            message: { type: string }
            data: {}
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, examples: [forbidden, entry_draft, rate_limited] }
            message: { type: string }
    Principal:
      type: object
      required: [id, role, tenant_id, scopes]
      properties:
        id: { type: string, description: "Token id, host id or sensor id." }
        role: { type: string, enum: [human, mcp, host, sensor] }
        tenant_id: { type: string }
        scopes: { type: array, items: { type: string }, description: "Sorted. `admin` implies every operator scope." }
    Health:
      type: object
      required: [status, service, version]
      properties:
        status: { type: string, const: ok }
        service: { type: string }
        version: { type: string }
    DecoyKind:
      type: string
      enum: [sandbox, emulation]
    TaxiiCollection:
      type: object
      required: [id, title, can_read, can_write]
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string }
        can_read: { type: boolean }
        can_write: { type: boolean }
        media_types: { type: array, items: { type: string } }
    IocType:
      type: string
      enum: [ip, ipv6, domain, url, http_path, http_ua, request_substring, payload_sha256, file_sha256, cmdline, dns_query, behaviour_fingerprint]
    DecoyState:
      type: string
      enum: [pending, starting, healthy, rotating, stopped, quarantined, failed, destroyed]
    ReasonCode:
      type: string
      enum: [max_lifetime, idle, reverse_shell, egress_blocked, yara_match, canary_used, honeyscore_high, health_failed, operator_manual]
    Reason:
      type: object
      additionalProperties: false
      required: [code, text]
      properties:
        code: { $ref: "#/components/schemas/ReasonCode" }
        text: { type: string, minLength: 1, maxLength: 500 }
    CatalogueEntry:
      description: See `catalogue/schema/entry.schema.json` for the full contract.
      type: object
      required: [id, product, vendor, version, decoy_kind, cves, listen_ports, sources, status, risk_notes]
      properties:
        id: { type: string }
        product: { type: string }
        vendor: { type: string }
        version: { type: string }
        decoy_kind: { $ref: "#/components/schemas/DecoyKind" }
        status: { type: string, enum: [draft, verified, deprecated] }
        cves: { type: array, items: { type: object } }
        listen_ports: { type: array, items: { type: object } }
        sources: { type: array, items: { type: string } }
        risk_notes: { type: string }
    CreateDecoy:
      type: object
      additionalProperties: false
      required: [catalogue_id]
      properties:
        catalogue_id: { type: string, examples: [foiled/demo-app/1.0.0] }
        label: { type: string, maxLength: 100 }
        lifetime_seconds: { type: integer, minimum: 1, maximum: 604800, default: 86400 }
        allow_draft: { type: boolean, default: false }
        sensor_id:
          type: string
          description: Place the decoy on this edge sensor of the caller's tenant (#31). The sensor must not be revoked, and sandbox entries need `sandbox_allowed` on the sensor. Without it, the first research host to lease the job takes it.
    Decoy:
      type: object
      required: [id, tenant_id, catalogue_id, decoy_kind, state, generation, created_at, updated_at, expires_at, created_by]
      properties:
        id: { type: string }
        tenant_id: { type: string }
        catalogue_id: { type: string }
        decoy_kind: { $ref: "#/components/schemas/DecoyKind" }
        label: { type: [string, "null"] }
        state: { $ref: "#/components/schemas/DecoyState" }
        host_id: { type: [string, "null"] }
        generation: { type: integer }
        created_at: { type: integer, description: "Unix ms." }
        updated_at: { type: integer, description: "Unix ms." }
        expires_at: { type: integer, description: "Unix ms after which the decoy rotates for max_lifetime." }
        created_by: { type: string }
    JobAccepted:
      type: object
      required: [decoy, job_id, job_kind]
      properties:
        decoy: { $ref: "#/components/schemas/Decoy" }
        job_id: { type: string }
        job_kind:
          type: string
          enum: [decoy.create, decoy.stop, decoy.rotate, decoy.reset, decoy.mark_compromised, decoy.destroy]
    UploadRequest:
      type: object
      additionalProperties: false
      required: [decoy_id, channel, sha256, size]
      properties:
        decoy_id: { type: string }
        attempt_id: { type: string }
        channel: { type: string, enum: [network, application, filesystem, process, quarantine, hook, dns, egress] }
        sha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        size: { type: integer, minimum: 1, maximum: 5368709120 }
    UploadGrant:
      type: object
      required: [method, url, headers, payload_ref, expires_at]
      properties:
        method: { type: string, const: PUT }
        url: { type: string, format: uri }
        headers:
          type: array
          description: Header name and value pairs the uploader must send unchanged.
          items: { type: array, items: { type: string }, minItems: 2, maxItems: 2 }
        payload_ref: { type: string, examples: ["r2://foiled-evidence/t1/dcy-1/_/network/9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08"] }
        expires_at: { type: integer, description: Unix ms. }
    RegisterAgent:
      type: object
      additionalProperties: false
      properties:
        label: { type: string, minLength: 1, maxLength: 100 }
        sandbox_allowed: { type: boolean, description: "Default false for sensors, true for hosts." }
        share_opt_in: { type: [boolean, "null"], description: "Contribute-back choice (#37). Omit for the policy default." }
        enrolment_ttl_seconds: { type: integer, minimum: 300, maximum: 86400, default: 3600 }
    AgentAction:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { $ref: "#/components/schemas/Reason" }
        enrolment_ttl_seconds: { type: integer, minimum: 300, maximum: 86400, default: 3600, description: "Re-enrol only." }
    AgentCreated:
      type: object
      required: [agent, enrolment]
      properties:
        agent: { $ref: "../schemas/agent/agent-record.schema.json" }
        enrolment:
          type: object
          required: [token, expires_at]
          properties:
            token: { type: string, description: "`foe_<id>.<secret>`. Shown once; only its hash is stored." }
            expires_at: { type: integer, description: Unix ms. }
    AgentList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "../schemas/agent/agent-record.schema.json" }
        next_cursor: { type: [string, "null"] }
    AgentRevoked:
      type: object
      required: [agent, ca_revoked, ca_failed]
      properties:
        agent: { $ref: "../schemas/agent/agent-record.schema.json" }
        ca_revoked: { type: integer, minimum: 0 }
        ca_failed: { type: integer, minimum: 0 }
    AuditRecord:
      type: object
      required: [id, ts, tenant_id, actor_id, actor_kind, action, outcome]
      properties:
        id: { type: string }
        ts: { type: integer }
        tenant_id: { type: string }
        actor_id: { type: string }
        actor_kind: { type: string, enum: [human, mcp, host, sensor] }
        action: { type: string }
        target: { type: [string, "null"] }
        reason_code: { type: [string, "null"] }
        reason_text: { type: [string, "null"] }
        job_id: { type: [string, "null"] }
        idempotency_key: { type: [string, "null"] }
        outcome: { type: string, enum: [accepted, denied, failed] }
        detail: {}
