    get:
      tags: [intel]
      operationId: getCampaignAttempts
      summary: Member attempts of a campaign
      description: Member attempts in the window, newest activity first, each with `campaign_id` set, including members of a campaign with only one attempt in the window. Needs `attempts:read` as well as `campaigns:read`.
      x-foiled-status: implemented
      x-foiled-store: postgres
      x-foiled-scopes: [campaigns:read, attempts:read]
      parameters:
        - { $ref: "#/components/parameters/CampaignId" }
        - { name: since, in: query, schema: { type: integer } }
        - { name: until, in: query, schema: { type: integer } }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Member attempts.
          content:
            application/json:
              schema:
                type: object
                required: [campaign_id, items, truncated]
                properties:
                  campaign_id: { type: string }
                  items:
                    type: array
                    items: { $ref: "../schemas/attempt.schema.json" }
                  truncated: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorised" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v0/campaigns/{campaign_id}/evidence:
    get:
      tags: [intel]
      operationId: getCampaignEvidence
      summary: Confidence and join evidence for a campaign
      description: |
        The full #27 explanation behind the campaign's `confidence_ref`: the
        campaign link (kind `attempt_campaign`, attempt: the seed) and one
        link per member, each listing the features that joined it, its noise
        score, and an analyst confirmation when an action put it there. Also
        the provenance of every recorded campaign folded into this one, and
        links refused because a single source made them.
      x-foiled-status: implemented
      x-foiled-store: postgres
      x-foiled-scopes: [campaigns:read]
      parameters:
        - { $ref: "#/components/parameters/CampaignId" }
        - { name: since, in: query, schema: { type: integer } }
        - { name: until, in: query, schema: { type: integer } }
      responses:
        "200":
          description: Evidence.
          content:
            application/json:
              schema:
                type: object
                required: [campaign_id, confidence, members, bridges, possible_links, truncated]
                properties:
                  campaign_id: { type: string }
                  confidence: { $ref: "../schemas/confidence-link.schema.json" }
                  members:
                    type: array
                    items: { $ref: "../schemas/confidence-link.schema.json" }
                  bridges:
                    type: array
                    description: Provenance of every merge the campaign registry made permanent for this campaign, across all windows.
                    items:
                      type: object
                      additionalProperties: false
                      required: [campaign_id, merged_campaign_id, attempt_id, with_attempt_id, signal_id, feature, attempt_side, with_side, small_halves, recorded_at]
                      properties:
                        campaign_id: { type: string }
                        merged_campaign_id: { type: [string, "null"], description: "Null when two groups merged before either was recorded." }
                        attempt_id: { type: string }
                        with_attempt_id: { type: string }
                        signal_id: { type: string }
                        feature: { type: string }
                        attempt_side: { type: integer }
                        with_side: { type: integer }
                        small_halves: { type: boolean, description: "One side was below the forged-bridge guard size; audit these." }
                        recorded_at: { type: integer }
                  possible_links:
                    type: array
                    description: Links refused because one source alone made them; an analyst may merge.
                    items:
                      type: object
                      additionalProperties: false
                      required: [other_campaign_ids, attempt_ids, src, signal_ids]
                      properties:
                        other_campaign_ids: { type: array, items: { type: string } }
                        attempt_ids: { type: array, items: { type: string } }
                        src: { type: string }
                        signal_ids: { type: array, items: { type: string } }
                  truncated: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorised" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v0/campaigns/{campaign_id}/actions:
    get:
      tags: [intel]
      operationId: listCampaignActions
      summary: Analyst actions that name a campaign
      description: Stored actions where the campaign is the target, a merged-in campaign or the result of a split, oldest first. Read from storage, so actions on campaigns outside the current window are still listed.
      x-foiled-status: implemented
      x-foiled-store: postgres
      x-foiled-scopes: [campaigns:read]
      parameters:
        - { $ref: "#/components/parameters/CampaignId" }
      responses:
        "200":
          description: Actions.
          content:
            application/json:
              schema:
                type: object
                required: [campaign_id, items]
                properties:
                  campaign_id: { type: string }
                  items:
                    type: array
                    items: { $ref: "../schemas/campaign-action.schema.json" }
        "401": { $ref: "#/components/responses/Unauthorised" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [intel]
      operationId: actOnCampaign
      summary: Label, set status, merge, split or give feedback on a campaign (audited)
      description: |
        Stored append-only and replayed over the clustering on every read
        (`docs/campaigns.md#analyst-actions`); actions resolve by campaign
        id. Written to the audit log as `campaign.<action>`. Rate limited
        per token (60 an hour by default). `merge` folds campaigns from the
        same window into this one; `split` moves the named member attempts
        into a campaign of their own and the rest keep the id; `feedback`
        `true_positive` confirms (score 100, wording "confirmed"). Raw
        capture events and attempts are never changed. Pass the same
        `since` and `until` as the read that found the campaign.
      x-foiled-status: implemented
      x-foiled-store: postgres
      x-foiled-scopes: [campaigns:write]
      parameters:
        - { $ref: "#/components/parameters/CampaignId" }
        - { name: since, in: query, schema: { type: integer } }
        - { name: until, in: query, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [action, note]
              properties:
                action: { type: string, enum: [label, status, merge, split, feedback] }
                title: { type: string, minLength: 1, maxLength: 120, description: "label only." }
                status: { type: [string, "null"], enum: [emerging, active, closed, null], description: "status only. Null or absent clears the override." }
                campaign_ids: { type: array, minItems: 1, maxItems: 20, items: { type: string }, description: "merge only." }
                attempt_ids: { type: array, minItems: 1, maxItems: 500, items: { type: string }, description: "split only. Members of this campaign." }
                feedback: { type: string, enum: [true_positive, false_positive, unsure], description: "feedback only." }
                note: { type: string, maxLength: 1000 }
      responses:
        "200":
          description: The stored action and the campaign as it is now (null if the action dissolved it).
          content:
            application/json:
              schema:
                type: object
                required: [action, campaign]
                properties:
                  action: { $ref: "../schemas/campaign-action.schema.json" }
                  campaign:
                    oneOf:
                      - { $ref: "../schemas/campaign.schema.json" }
                      - { type: "null" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorised" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v0/actors:
    get:
      tags: [intel]
      operationId: listActors
      summary: Actor reference catalogue from public sources
      description: |
        Actor profiles Foiled can suggest a possible association with
        (#29, `docs/actor-attribution.md`): MITRE ATT&CK groups from the
        pinned sidecar (`attack:G0000`) and curated public reports
        (`report:<slug>`), each with its sources, publication dates,
        SHA-256 pins and licences. The same for every tenant. Responses
        carry MITRE's notice, which travels with ATT&CK group names.
      x-foiled-status: implemented
      x-foiled-store: bundle
      x-foiled-scopes: [campaigns:read]
      parameters:
        - { name: q, in: query, description: "Case-insensitive text in the label or an alias.", schema: { type: string, maxLength: 100 } }
        - { name: label_kind, in: query, schema: { type: string, enum: [nexus, cluster, named_group] } }
        - { name: source, in: query, schema: { type: string, enum: [attack, report] } }
        - { name: technique, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200 } }
        - { name: cursor, in: query, description: "Return profiles after this actor id (next_cursor).", schema: { type: string } }
      responses:
        "200":
          description: Profiles, sorted by actor id.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor, population, attack_version, attack_notice]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/ActorProfile" } }
                  next_cursor: { type: [string, "null"] }
                  population: { type: integer, description: "Profiles in the rarity population." }
                  attack_version: { type: [string, "null"] }
                  attack_notice: { type: [string, "null"] }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorised" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v0/actors/{actor_id}:
    get:
      tags: [intel]
      operationId: getActor
      summary: One actor profile
      x-foiled-status: implemented
      x-foiled-store: bundle
      x-foiled-scopes: [campaigns:read]
      parameters:
        - { name: actor_id, in: path, required: true, schema: { type: string, pattern: "^(attack|report):[A-Za-z0-9-]{1,64}$" } }
      responses:
        "200":
          description: The profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActorProfile" }
        "401": { $ref: "#/components/responses/Unauthorised" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v0/actor-links:
    get:
      tags: [intel]
      operationId: listActorLinks
      summary: Actor possible-associations for campaigns and lone attempts
      description: |
        Matched on request over the campaigns (#33) and lone attempts (#25)
        in the window: technique overlap weighted by rarity, indicator
        overlap with public reports, and targeting. Geography and a shared
        ASN are never evidence. Scored through #27 as `attempt_actor` and
        capped in code: below `medium` without a shared indicator, below
        `high` and never publishable until an analyst confirms. Wording is
        "possible association" unless confirmed; `statement` is the only
        sentence clients may show. The review queue (#35) reads
        `review_queue=true` with no `status` filter, so confirmed links
        with attempts the confirmation does not cover come back for review.
        Strongest first.
      x-foiled-status: implemented
      x-foiled-store: postgres
      x-foiled-scopes: [campaigns:read]
      parameters:
        - { name: since, in: query, schema: { type: integer } }
        - { name: until, in: query, schema: { type: integer } }
        - { name: status, in: query, schema: { type: string, enum: [pending, confirmed, rejected] } }
        - { name: subject_kind, in: query, schema: { type: string, enum: [campaign, attempt] } }
        - { name: subject_id, in: query, description: "A campaign or attempt id.", schema: { type: string } }
        - { name: actor_id, in: query, schema: { type: string } }
        - { name: review_queue, in: query, description: "Only links that need analyst attention (#35), whatever their status: pending at or above radar_queue_min, or confirmed with attempts the confirmation does not cover (new_since_confirmation). Do not combine with status=pending.", schema: { type: boolean } }
        - { name: min_confidence, in: query, schema: { type: integer, minimum: 0, maximum: 100 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200 } }
      responses:
        "200":
          description: Links.
          content:
            application/json:
              schema:
                type: object
                required: [items, truncated]
                properties:
                  items: { type: array, items: { $ref: "../schemas/actor-link.schema.json" } }
                  truncated: { type: boolean }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorised" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v0/actor-links/{link_id}:
    get:
      tags: [intel]
      operationId: getActorLink
      summary: One actor link with its full explanation
      description: The target of `confidence_ref` on a campaign's `suggested_actor_links`. Pass the same `since` and `until` as the read that found it.
      x-foiled-status: implemented
      x-foiled-store: postgres
      x-foiled-scopes: [campaigns:read]
      parameters:
        - { $ref: "#/components/parameters/ActorLinkId" }
        - { name: since, in: query, schema: { type: integer } }
        - { name: until, in: query, schema: { type: integer } }
      responses:
        "200":
          description: The link.
          content:
            application/json:
              schema: { $ref: "../schemas/actor-link.schema.json" }
        "401": { $ref: "#/components/responses/Unauthorised" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v0/actor-links/{link_id}/decision:
    post:
      tags: [review]
      operationId: decideActorLink
      summary: Confirm, reject or reopen an actor link (audited)
      description: |
        `confirm` is the only way an actor link reaches `high`, the wording
        "confirmed association" and exports (#13); it needs a note saying
        why. It covers the subject's attempts at that moment only: later
        members are listed in `new_since_confirmation`, are not exported as
        confirmed, and send the link back to the review queue. `reject` suppresses the link (score 0, never suggested or
        exported). `reopen` returns it to pending. The latest decision per
        campaign or attempt and actor is stored and applies on every later
        read. Written to the audit log as `actor_link.<decision>` with the
        score before. Rate limited per token (60 an hour by default).
      x-foiled-status: implemented
      x-foiled-store: postgres
      x-foiled-scopes: [review:write]
      parameters:
        - { $ref: "#/components/parameters/ActorLinkId" }
        - { name: since, in: query, schema: { type: integer } }
        - { name: until, in: query, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision, note]
              properties:
                decision: { type: string, enum: [confirm, reject, reopen] }
                note: { type: string, maxLength: 1000, description: "Required (not blank) to confirm." }
      responses:
        "200":
          description: The link as it scores now.
          content:
            application/json:
              schema: { $ref: "../schemas/actor-link.schema.json" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorised" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v0/iocs:
    get:
      tags: [intel]
      operationId: searchIocs
      summary: Search IOCs
      description: |
        Extracted on request from the attempts in a window (default the last
        7 days, at most 31 days and 20,000 events) with the deterministic
        extraction in `docs/iocs.md`, deduplicated by type and value.
        Newest activity first. `value` matches exactly, accepts defanged
        input (`203[.]0[.]113[.]7`, `hxxp://`) and ignores case for
        addresses, names, hashes and fingerprints. `value` is hostile text:
        render `display`. Address IOCs carry ASN context from cached
        enrichment Facts (#11) when present.
      parameters:
        - { name: since, in: query, schema: { type: integer }, description: "Unix ms, inclusive." }
        - { name: until, in: query, schema: { type: integer }, description: "Unix ms, exclusive." }
        - { name: type, in: query, schema: { $ref: "#/components/schemas/IocType" } }
        - { name: value, in: query, schema: { type: string, maxLength: 2048 } }
        - { name: role, in: query, schema: { type: string, enum: [source, request, payload, callback, stage2, post_exploit, behaviour] } }
        - { name: attempt_id, in: query, schema: { type: string } }
        - { name: campaign_id, in: query, schema: { type: string } }
        - { name: file_ioc_limited, in: query, schema: { type: boolean } }
        - { $ref: "#/components/parameters/Limit" }
      x-foiled-status: implemented
      x-foiled-store: postgres
      x-foiled-scopes: [iocs:read]
      responses:
        "200":
          description: Matching IOCs.
          headers:
            x-foiled-enrichment: { $ref: "#/components/headers/EnrichmentUnavailable" }
          content:
            application/json:
              schema:
                type: object
                required: [items, truncated]
                properties:
                  items:
                    type: array
                    items: { $ref: "../schemas/ioc.schema.json" }
                  truncated: { type: boolean }
                  enrichment_unavailable: { type: boolean, description: "The enrichment cache could not be read; `enrichment` is empty (#11)." }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorised" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v0/iocs/{ioc_id}:
    get:
      tags: [intel]
      operationId: getIoc
      summary: Get one IOC
      description: IOC ids are stable for the same type and value. Pass the same `since` and `until` as the search for indicators older than 7 days.
      x-foiled-status: implemented
      x-foiled-store: postgres
      x-foiled-scopes: [iocs:read]
      parameters:
        - { name: ioc_id, in: path, required: true, schema: { type: string, pattern: "^ioc_[a-f0-9]{24}$" } }
        - { name: since, in: query, schema: { type: integer } }
        - { name: until, in: query, schema: { type: integer } }
      responses:
        "200":
          description: The IOC.
          headers:
            x-foiled-enrichment: { $ref: "#/components/headers/EnrichmentUnavailable" }
          content:
            application/json:
              schema: { $ref: "../schemas/ioc.schema.json" }
        "401": { $ref: "#/components/responses/Unauthorised" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v0/review-queue:
    get:
      tags: [review]
      operationId: listReviewQueue
      summary: Analyst review queue
      description: |
        One queue over pending CVE and technique links, pre-disclosure
        candidates, IOC publication candidates, campaign labels, actor
        possible-associations and write-ups in review
        (`docs/review-queue.md`). Items are derived from the attempts in a
        window (default the last 7 days, at most 31 days and 20,000 events)
        and merged with the stored analyst state. Highest priority first:
        kind, confidence, then SLA age, with overdue items ahead. Scoped to
        the caller's tenant.
      x-foiled-status: implemented
      x-foiled-store: postgres
      x-foiled-scopes: [review:read]
      parameters:
        - { name: since, in: query, schema: { type: integer }, description: "Unix ms, inclusive." }
        - { name: until, in: query, schema: { type: integer }, description: "Unix ms, exclusive." }
        - { name: kind, in: query, schema: { type: string, enum: [cve_link, predisclosure_candidate, technique_link, ioc_publication, campaign_label, campaign_merge, false_positive_feedback, actor_association, write_up] } }
        - { name: status, in: query, schema: { type: string, enum: [pending, open, claimed, snoozed, approved, rejected, needs_attention, all], default: pending }, description: "pending is every undecided item: open, claimed, snoozed and needs_attention." }
        - { name: assignee, in: query, schema: { type: string, maxLength: 128 }, description: "A token id, or me." }
        - { name: sla_breached, in: query, schema: { type: boolean } }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Queue items.
          content:
            application/json:
              schema:
                type: object
                required: [items, total, truncated, notes]
                properties:
                  items:
                    type: array
                    items: { $ref: "../schemas/review-item.schema.json" }
                  total: { type: integer, description: "Matching items before limit." }
                  truncated: { type: boolean }
                  notes: { type: array, items: { type: string } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorised" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v0/review-queue/{item_id}:
    get:
      tags: [review]
      operationId: getReviewItem
      summary: Get a review queue item
      description: Pass the same `since` and `until` as the list that found it.
      x-foiled-status: implemented
      x-foiled-store: postgres
      x-foiled-scopes: [review:read]
      parameters:
        - { $ref: "#/components/parameters/ReviewItemId" }
        - { name: since, in: query, schema: { type: integer } }
        - { name: until, in: query, schema: { type: integer } }
      responses:
        "200":
          description: The item.
          content:
            application/json:
              schema: { $ref: "../schemas/review-item.schema.json" }
        "401": { $ref: "#/components/responses/Unauthorised" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v0/review-queue/{item_id}/actions:
    post:
      tags: [review]
      operationId: actOnReviewItem
      summary: Claim, assign, release, approve, reject, snooze or promote (audited)
      description: |
        Audited as `review.<action>`. Decisions are final. Approve and
        reject also record the decision where it belongs: a link override
        (`cve_link`, `predisclosure_candidate`, `technique_link`, and
        `actor_association` on the anchor attempts, and
        `false_positive_feedback`), campaign `label` and `feedback` actions
        (`campaign_label`), a campaign `merge` action (`campaign_merge`
        approve), the write-up transition to
        `approved` or back to `draft` (`write_up`, needs `checklist` to
        approve), or the IOC's release clearance (`ioc_publication`).
        The version is claimed (compare and set) before the effect is
        applied; if the effect fails the item goes back to its earlier
        state. `promote` starts a draft write-up and does not decide the item. An
        item claimed by someone else can only be reassigned. Pass
        `expected_version` to refuse the action if the item changed. Rate
        limited per token (240 an hour by default, shared with write-up
        writes and radar rollups).
      x-foiled-status: implemented
      x-foiled-store: postgres
      x-foiled-scopes: [review:write]
      parameters:
        - { $ref: "#/components/parameters/ReviewItemId" }
        - { name: since, in: query, schema: { type: integer } }
        - { name: until, in: query, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [action]
              properties:
                action: { type: string, enum: [claim, assign, release, approve, reject, snooze, promote] }
                assignee: { type: string, maxLength: 128, description: "assign only. A token id." }
                until: { type: integer, description: "snooze only. Unix ms, at most 30 days away." }
                note: { type: string, maxLength: 1000, description: "Required for reject." }
                expected_version: { type: integer, minimum: 0 }
                label: { type: string, minLength: 1, maxLength: 120, description: "approve on campaign_label: the campaign title." }
                checklist:
                  type: object
                  description: "approve on write_up: the second reviewer's checklist, every item true."
                  additionalProperties: false
                  required: [tenant_data_removed, wording_checked, no_exploit_code, payloads_redacted, sources_linked, delay_rules_checked]
                  properties:
                    tenant_data_removed: { type: boolean }
                    wording_checked: { type: boolean }
                    no_exploit_code: { type: boolean }
                    payloads_redacted: { type: boolean }
                    sources_linked: { type: boolean }
                    delay_rules_checked: { type: boolean }
      responses:
        "200":
          description: The item as it is now.
          content:
            application/json:
              schema:
                type: object
                required: [item, effect, writeup_id]
                properties:
                  item: { $ref: "../schemas/review-item.schema.json" }
                  effect: { type: [string, "null"], description: "What the decision changed besides the queue." }
                  writeup_id: { type: [string, "null"], description: "promote: the new draft." }
        "400": { $ref: "#/components/responses/BadRequest" }
