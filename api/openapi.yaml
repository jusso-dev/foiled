        - { name: ioc_id, in: path, required: true, schema: { type: string, pattern: "^ioc_[a-f0-9]{24}$" } }
        - { name: since, in: query, schema: { type: integer } }
        - { name: until, in: query, schema: { type: integer } }
      responses:
        "200":
          description: The IOC.
          headers:
            x-foiled-enrichment: { $ref: "#/components/headers/EnrichmentUnavailable" }
          content:
            application/json:
