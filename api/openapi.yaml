        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterAgent" }
      responses:
        "201":
          description: Registered. Hand the token to the sensor over a trusted channel.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentCreated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorised" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v0/sensors/{sensor_id}:
    get:
