openapi: 3.1.0
info:
  title: Foiled control plane API
  version: 0.1.0
  summary: Trusted-side API for decoys, attempts, intel and the review queue.
  description: |
    The Foiled control plane is a trusted interface only. It runs as an Axum
    Worker on Cloudflare (ADR 0009) and is never served from a honeypot IP or
    a decoy network.

    Clients:
    - Operators (console #14 and CLI) and MCP agents (#24) use bearer tokens
      on the API hostname.
    - Sandbox hosts (#41) and edge sensors (#31) use mTLS client
      certificates on a separate ingest hostname. Their identities carry only
      `host:*` or `sensor:*` scopes and can never hold operator scopes.

    Every write is audited (`/v0/audit`). Destructive actions need a
    `reason`. CPU-heavy work (bulk re-score) runs on Queue consumers; the
    request only enqueues it. Exports are built on request from the same
    bounded window as attempts (`docs/intel-outputs.md`).

    Each operation carries:
    - `x-foiled-status`: `implemented` or `planned`. Planned paths are part of
      the contract but not served yet; the owning issue is in `x-foiled-issue`.
    - `x-foiled-store`: the backing store (`d1`, `postgres`, `r2`, `do`,
      `queue`, `bundle` for the build-time catalogue).
  license:
    name: MIT
    identifier: MIT
servers:
  - url: https://api.example.invalid
    description: Operator and MCP API (placeholder hostname)
  - url: https://ingest.example.invalid
    description: Host and sensor ingest, mTLS required (placeholder hostname)
security:
  - bearer: []
tags:
  - name: health
    description: "Liveness."
  - name: auth
    description: "The authenticated caller (#14)."
  - name: catalogue
    description: "Read-only decoy catalogue (#5)."
  - name: decoys
    description: "Decoy lifecycle (#8, #21)."
  - name: hosts
    description: "Sandbox host registry and enrolment (operators), and the host agent channel (mTLS only) (#41, #31)."
  - name: ingest
    description: "Evidence ingest from hosts and sensors, mTLS only (#9, #31)."
  - name: attempts
    description: "Exploit attempts and their links (#25, #27)."
  - name: intel
    description: "Campaigns and IOCs (#33, #34)."
  - name: review
    description: "Analyst review queue, research write-ups and the radar (#35)."
  - name: public
    description: "Unauthenticated public pages data: published exploit pages (#35). The radar is trusted-side only."
  - name: sensors
    description: "Edge sensor registry, enrolment, revocation and the sensor agent channel (#31)."
  - name: quarantine
    description: "Quarantined payload metadata (#9)."
  - name: exports
    description: "Intel exports: STIX 2.1, MISP, IOC CSV and JSON (#13, #22). See docs/intel-outputs.md."
  - name: taxii
    description: "Read-only TAXII 2.1 server (#13)."
  - name: alerts
    description: "Alerting (#15)."
  - name: audit
    description: "Audit log (#21)."
  - name: events
    description: "Live event stream (#14)."
  - name: mcp
    description: "MCP server for agents (#24). See docs/mcp/foiled-mcp.md."

paths:
  /healthz:
    get:
      tags: [health]
      operationId: getHealth
      summary: Liveness check
      security: []
      x-foiled-status: implemented
      x-foiled-store: none
      responses:
        "200":
          description: The Worker is up.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /v0/whoami:
    get:
      tags: [auth]
      operationId: whoami
      summary: The authenticated caller
      description: |
        Id, role, tenant and scopes of the token or certificate on the
        request. The console (#14) calls it at sign-in to check a token and
        to hide actions the token cannot take; the API still enforces every
        scope. Needs no particular scope.
      x-foiled-status: implemented
      x-foiled-store: d1
      x-foiled-scopes: []
      responses:
        "200":
          description: The caller.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Principal" }
        "401": { $ref: "#/components/responses/Unauthorised" }

  /v0/catalogue/entries:
    get:
      tags: [catalogue]
      operationId: listCatalogueEntries
      summary: List catalogue entries
      description: Read only. The catalogue changes through reviewed pull requests (#5).
      x-foiled-status: implemented
      x-foiled-store: bundle
      x-foiled-scopes: [catalogue:read]
      parameters:
        - { name: decoy_kind, in: query, schema: { $ref: "#/components/schemas/DecoyKind" } }
        - { name: status, in: query, schema: { type: string, enum: [draft, verified, deprecated] } }
        - { name: cve, in: query, schema: { type: string }, description: "Case-insensitive CVE or FOILED-DEMO id." }
      responses:
        "200":
          description: Matching entries, sorted by id.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/CatalogueEntry" }
        "401": { $ref: "#/components/responses/Unauthorised" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v0/catalogue/entries/{entry_id}:
    get:
      tags: [catalogue]
      operationId: getCatalogueEntry
      summary: Get one catalogue entry
      description: Ids contain slashes, for example `foiled/demo-app/1.0.0`; send them unescaped.
      x-foiled-status: implemented
      x-foiled-store: bundle
      x-foiled-scopes: [catalogue:read]
      parameters:
        - { name: entry_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The entry.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogueEntry" }
        "401": { $ref: "#/components/responses/Unauthorised" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v0/decoys:
    get:
      tags: [decoys]
      operationId: listDecoys
      summary: List decoys (alias /v0/sandboxes)
      x-foiled-status: implemented
      x-foiled-store: d1
      x-foiled-scopes: [decoys:read]
      parameters:
        - { name: state, in: query, schema: { $ref: "#/components/schemas/DecoyState" } }
        - { name: catalogue_id, in: query, schema: { type: string } }
        - { name: created_by, in: query, schema: { type: string }, description: "Only decoys created by this token id (the MCP agent cap counts with this, #24)." }
        - { name: live, in: query, schema: { type: boolean, default: false }, description: "Only decoys that are not destroyed." }
        - { $ref: "#/components/parameters/Limit" }
        - { name: cursor, in: query, schema: { type: string }, description: "`next_cursor` from the previous page." }
      responses:
        "200":
          description: Newest first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Decoy" }
                  next_cursor: { type: [string, "null"] }
        "401": { $ref: "#/components/responses/Unauthorised" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [decoys]
      operationId: createDecoy
      summary: Launch a decoy from a catalogue entry (alias /v0/sandboxes)
      description: |
        Writes a `pending` decoy and a `decoy.create` job for a host agent to
        lease. Draft entries need `allow_draft: true` and `decoys:elevate`.
        Deprecated entries and Docker-runtime entries are refused. Every
        decoy inherits deny-by-default egress (#4). Rate limited per principal
        (default 10 an hour) and capped per tenant (default 5 live decoys).
      x-foiled-status: implemented
      x-foiled-store: d1
      x-foiled-scopes: [decoys:write]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateDecoy" }
      responses:
        "201":
          description: Accepted; the decoy is pending until a host reports.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobAccepted" }
        "200":
          description: A retry with the same `Idempotency-Key`; returns the original decoy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobAccepted" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorised" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v0/decoys/{decoy_id}:
    get:
      tags: [decoys]
      operationId: getDecoy
      summary: Get a decoy
      x-foiled-status: implemented
      x-foiled-store: d1
      x-foiled-scopes: [decoys:read]
      parameters:
        - $ref: "#/components/parameters/DecoyId"
      responses:
        "200":
          description: The decoy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Decoy" }
        "401": { $ref: "#/components/responses/Unauthorised" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v0/decoys/{decoy_id}:stop:
    $ref: "#/components/pathItems/DecoyAction"
  /v0/decoys/{decoy_id}:rotate:
    $ref: "#/components/pathItems/DecoyAction"
  /v0/decoys/{decoy_id}:reset:
    $ref: "#/components/pathItems/DecoyAction"
  /v0/decoys/{decoy_id}:mark-compromised:
    $ref: "#/components/pathItems/DecoyAction"
  /v0/decoys/{decoy_id}:destroy:
    $ref: "#/components/pathItems/DecoyAction"

  /v0/hosts:
    get:
      tags: [hosts]
      operationId: listHosts
      summary: List registered hosts
      description: Newest first, this tenant only (#31).
      x-foiled-status: implemented
      x-foiled-store: d1
      x-foiled-scopes: [hosts:read]
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { name: cursor, in: query, schema: { type: string }, description: "`next_cursor` from the previous page." }
      responses:
        "200":
          description: Registered hosts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentList" }
        "401": { $ref: "#/components/responses/Unauthorised" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [hosts]
      operationId: registerHost
      summary: Register a host and mint its one-time enrolment token
      description: |
        Creates a `pending` host in the caller's tenant and returns a
        one-time enrolment token (`foe_<id>.<secret>`), shown once and stored
        only as a SHA-256 hash. The token expires after
        `enrolment_ttl_seconds` (default 3600, 300 to 86400) and is redeemed
        with `POST /v0/enrol`. Research hosts default to `sandbox_allowed: true`. This is the enrolment path for sandbox hosts (#41). Audited as `host.create`;
        the token is never written to the audit log. Rate limited per
        principal (default 10 an hour).
      x-foiled-status: implemented
      x-foiled-store: d1
      x-foiled-scopes: [hosts:write]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterAgent" }
      responses:
        "201":
          description: Registered. Hand the token to the host over a trusted channel.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentCreated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorised" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v0/hosts/{host_id}:
    get:
      tags: [hosts]
      operationId: getHost
      summary: One registered host
      x-foiled-status: implemented
      x-foiled-store: d1
      x-foiled-scopes: [hosts:read]
      parameters:
        - { name: host_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The host.
          content:
            application/json:
              schema: { $ref: "../schemas/agent/agent-record.schema.json" }
        "401": { $ref: "#/components/responses/Unauthorised" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v0/hosts/{host_id}:revoke:
    post:
      tags: [hosts]
      operationId: revokeHost
      summary: Revoke a host and every certificate it holds
      description: |
        Final. Marks the host and all of its certificates revoked in D1 (the
        Worker refuses them from this request on), closes any unused
        enrolment token, then revokes each certificate at the
        Cloudflare-managed CA so the WAF rule's `cert_revoked` check blocks it
        at the edge. `ca_failed` counts certificates the CA did not revoke
        (their fingerprints are in the audit record's `revoke_in_dashboard`);
        finish those in the dashboard. A `reason` is required and audited as
        `host.revoke`. A revoked host cannot be re-enrolled: register a
        new one.
      x-foiled-status: implemented
      x-foiled-store: d1
      x-foiled-scopes: [hosts:write]
      parameters:
        - { name: host_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentAction" }
      responses:
        "200":
          description: Revoked.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentRevoked" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorised" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v0/hosts/{host_id}:reenrol:
    post:
      tags: [hosts]
      operationId: reenrolHost
      summary: Mint a new enrolment token for a host that lost its key
      description: |
        For a rebuilt or wiped host that is not suspected of compromise
        (revoke that instead). Any unused token is closed. Redeeming the new
        token retires the host's existing certificates immediately, with
        no grace period. Audited as `host.reenrol`; refused with 409 for a
        revoked host.
      x-foiled-status: implemented
      x-foiled-store: d1
      x-foiled-scopes: [hosts:write]
      parameters:
        - { name: host_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentAction" }
      responses:
        "201":
          description: New token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentCreated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorised" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v0/hosts/{host_id}/certificate:renew:
    post:
      tags: [hosts]
      operationId: renewHostCertificate
      summary: Renew this host's client certificate with a new key
      description: |
        Called by the host itself over mTLS, with a CSR for a freshly
        generated key. The previous certificate keeps working for 24 hours
        so a lost response can be retried, then stops. Only as itself
        (403 otherwise), only while active, and rate limited (default 4 a
        day). Audited as `host.renew`.
      security: [{ mtls: [] }]
      x-foiled-status: implemented
      x-foiled-store: d1
      x-foiled-scopes: [host:report]
      parameters:
        - { name: host_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [csr_pem]
              properties:
                csr_pem: { type: string, maxLength: 8192 }
      responses:
        "201":
          description: New certificate.
          content:
            application/json:
              schema: { $ref: "../schemas/agent/enrol-response.schema.json" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorised" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502":
          description: The certificate authority did not issue a certificate.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: Certificate issuance is not configured.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v0/hosts/{host_id}/heartbeat:
    post:
      tags: [hosts]
      operationId: hostHeartbeat
      summary: Sandbox host health report
      description: Host health, KVM present, public exposure, free disk, running decoys, agent version and buffer counters. The control plane records clock skew from `host_time` (#41).
      security: [{ mtls: [] }]
      x-foiled-status: implemented
      x-foiled-store: d1
      x-foiled-scopes: [host:report]
      parameters:
        - $ref: "#/components/parameters/HostId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../schemas/agent/heartbeat.schema.json" }
      responses:
        "204": { description: "Recorded." }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorised" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v0/hosts/{host_id}/jobs:lease:
    post:
      tags: [hosts]
      operationId: leaseJobs
      summary: Lease signed jobs for this host
      description: |
        Returns up to `max` jobs placed on this host (or not yet placed, which
        this lease places here), each signed with the control plane's Ed25519
        key and carrying an idempotency key, `reason` and expiry. Leases last
        5 minutes; a lapsed lease can be taken again by the same host. A host
        certificate can only lease its own jobs (#41).
      security: [{ mtls: [] }]
      x-foiled-status: implemented
      x-foiled-store: d1
      x-foiled-scopes: [host:lease]
      parameters:
        - $ref: "#/components/parameters/HostId"
        - { name: max, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 10 } }
      responses:
        "200":
          description: Zero or more signed jobs.
          content:
            application/json:
              schema:
                type: object
                required: [jobs, lease_expires_at]
                properties:
                  jobs:
                    type: array
                    items: { $ref: "../schemas/agent/signed-job.schema.json" }
                  lease_expires_at: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorised" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503":
          description: Job signing is not configured.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v0/hosts/{host_id}/jobs/{job_id}:ack:
    post:
      tags: [hosts]
      operationId: ackJob
      summary: Report a job result
      description: |
        Closes a job leased by this host. A reported `decoy_state` is applied
        by walking the allowed transitions (`docs/rotation.md`); a successful
        rotate or reset always passes through `rotating` and bumps the
        generation. Impossible states are refused with 409. Audited as
        `job.ack`.
      security: [{ mtls: [] }]
      x-foiled-status: implemented
      x-foiled-store: d1
      x-foiled-scopes: [host:report]
      parameters:
        - $ref: "#/components/parameters/HostId"
        - { name: job_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../schemas/agent/job-result.schema.json" }
      responses:
        "204": { description: "Recorded." }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorised" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v0/uploads:
    post:
      tags: [ingest]
      operationId: mintUploadUrl
      summary: Mint a short-lived R2 upload URL for one evidence object
      description: |
        Pcaps, file diffs, quarantined payloads and large request slices go
        straight to R2 and never through a Worker request body. The presigned
        PUT is scoped to one object key under the caller's tenant and decoy,
        carries the object's SHA-256 as a signed `x-amz-checksum-sha256`
        header (R2 rejects a body that does not match), and expires in
        minutes. Only decoys assigned to the calling host or sensor (#9).
      security: [{ mtls: [] }]
      x-foiled-status: implemented
      x-foiled-store: r2
      x-foiled-scopes: [host:upload, sensor:upload]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UploadRequest" }
      responses:
        "201":
          description: Upload URL, required headers and the `payload_ref` to cite in events.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadGrant" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorised" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503":
          description: Uploads are not configured on this deployment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v0/ingest/events:
    post:
      tags: [ingest]
      operationId: ingestEvents
      summary: Submit a batch of capture envelopes
      description: |
        1 to 100 envelopes, each validated against
        `schemas/capture-event.schema.json` and the core checks (size, time,
        IPs, hook channel, payload references under the caller's own tenant
        and decoy). Any invalid event rejects the batch. Accepted events are
        stamped with the certificate identity (claimed `source` and
        `tenant_id` are replaced) and put on the ingest Queue (#9, #31).
      security: [{ mtls: [] }]
      x-foiled-status: implemented
      x-foiled-store: queue
      x-foiled-scopes: [host:ingest, sensor:ingest]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [events]
              properties:
                events:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: { $ref: "../schemas/capture-event.schema.json" }
      responses:
        "202":
          description: Queued.
          content:
            application/json:
              schema:
                type: object
                required: [accepted]
                properties:
                  accepted: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorised" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /v0/enrol:
    post:
      tags: [sensors]
      operationId: enrol
      summary: Redeem a one-time enrolment token with a CSR
      description: |
        Called once by a new sensor or host, before it has a certificate, on
        the ingest hostname (the only path the mTLS WAF rule exempts). The
        agent generates its key pair locally and sends only a CSR; a body
        holding a private key, or a key the CA will not sign (only ECDSA
        P-256 or P-384, or RSA 2048 to 4096 bits), is refused with 400
        before the token is touched. The token decides the identity
        (id, role, tenant, scopes); the CSR subject is ignored. The CSR is
        signed by the Cloudflare-managed client CA and the certificate's
        SHA-256 fingerprint is bound to the identity in D1. Tokens are single
        use: reuse, a wrong secret or an expired token is 401 and audited as
        `sensor.enrol` or `host.enrol` with outcome `denied`. Rate limited
        per source IP (default 30 an hour).
      security: []
      x-foiled-status: implemented
      x-foiled-store: d1
      x-foiled-scopes: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../schemas/agent/enrol-request.schema.json" }
