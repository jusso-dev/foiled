openapi: 3.1.0
info:
  title: Foiled control plane API
  version: 0.1.0
  summary: Trusted-side API for decoys, attempts, intel and the review queue.
  description: |
    The Foiled control plane is a trusted interface only. It runs as an Axum
    Worker on Cloudflare (ADR 0009) and is never served from a honeypot IP or
    a decoy network.

    Clients:
    - Operators (console #14 and CLI) and MCP agents (#24) use bearer tokens
      on the API hostname.
    - Sandbox hosts (#41) and edge sensors (#31) use mTLS client
      certificates on a separate ingest hostname. Their identities carry only
      `host:*` or `sensor:*` scopes and can never hold operator scopes.

    Every write is audited (`/v0/audit`). Destructive actions need a
    `reason`. CPU-heavy work (exports, bulk re-score) runs on Queue consumers;
    the request only enqueues it.

    Each operation carries:
    - `x-foiled-status`: `implemented` or `planned`. Planned paths are part of
      the contract but not served yet; the owning issue is in `x-foiled-issue`.
    - `x-foiled-store`: the backing store (`d1`, `postgres`, `r2`, `do`,
      `queue`, `bundle` for the build-time catalogue).
  license:
    name: MIT
    identifier: MIT
servers:
  - url: https://api.example.invalid
    description: Operator and MCP API (placeholder hostname)
  - url: https://ingest.example.invalid
    description: Host and sensor ingest, mTLS required (placeholder hostname)
security:
  - bearer: []
tags:
  - name: health
    description: "Liveness."
  - name: catalogue
    description: "Read-only decoy catalogue (#5)."
  - name: decoys
    description: "Decoy lifecycle (#8, #21)."
  - name: hosts
    description: "Sandbox host agent channel, mTLS only (#41)."
  - name: ingest
    description: "Evidence ingest from hosts and sensors, mTLS only (#9, #31)."
  - name: attempts
    description: "Exploit attempts and their links (#25, #27)."
  - name: intel
    description: "Campaigns and IOCs (#33, #34)."
  - name: review
    description: "Analyst review queue (#35)."
  - name: sensors
    description: "Edge sensor enrolment (#31)."
  - name: quarantine
    description: "Quarantined payload metadata (#9)."
  - name: exports
    description: "Intel exports (#13, #22)."
  - name: alerts
    description: "Alerting (#15)."
  - name: audit
    description: "Audit log (#21)."
  - name: events
    description: "Live event stream (#14)."
  - name: mcp
    description: "MCP server for agents (#24). See docs/mcp/foiled-mcp.md."

paths:
  /healthz:
    get:
      tags: [health]
      operationId: getHealth
      summary: Liveness check
      security: []
      x-foiled-status: implemented
      x-foiled-store: none
      responses:
        "200":
          description: The Worker is up.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /v0/catalogue/entries:
    get:
      tags: [catalogue]
      operationId: listCatalogueEntries
      summary: List catalogue entries
      description: Read only. The catalogue changes through reviewed pull requests (#5).
      x-foiled-status: implemented
      x-foiled-store: bundle
      x-foiled-scopes: [catalogue:read]
      parameters:
        - { name: decoy_kind, in: query, schema: { $ref: "#/components/schemas/DecoyKind" } }
        - { name: status, in: query, schema: { type: string, enum: [draft, verified, deprecated] } }
        - { name: cve, in: query, schema: { type: string }, description: "Case-insensitive CVE or FOILED-DEMO id." }
      responses:
        "200":
          description: Matching entries, sorted by id.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/CatalogueEntry" }
        "401": { $ref: "#/components/responses/Unauthorised" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v0/catalogue/entries/{entry_id}:
    get:
      tags: [catalogue]
      operationId: getCatalogueEntry
      summary: Get one catalogue entry
      description: Ids contain slashes, for example `foiled/demo-app/1.0.0`; send them unescaped.
      x-foiled-status: implemented
      x-foiled-store: bundle
      x-foiled-scopes: [catalogue:read]
      parameters:
        - { name: entry_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The entry.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogueEntry" }
        "401": { $ref: "#/components/responses/Unauthorised" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v0/decoys:
    get:
      tags: [decoys]
      operationId: listDecoys
      summary: List decoys (alias /v0/sandboxes)
      x-foiled-status: implemented
      x-foiled-store: d1
      x-foiled-scopes: [decoys:read]
      parameters:
        - { name: state, in: query, schema: { $ref: "#/components/schemas/DecoyState" } }
        - { name: catalogue_id, in: query, schema: { type: string } }
        - { $ref: "#/components/parameters/Limit" }
        - { name: cursor, in: query, schema: { type: string }, description: "`next_cursor` from the previous page." }
      responses:
        "200":
          description: Newest first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Decoy" }
                  next_cursor: { type: [string, "null"] }
        "401": { $ref: "#/components/responses/Unauthorised" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [decoys]
      operationId: createDecoy
      summary: Launch a decoy from a catalogue entry (alias /v0/sandboxes)
      description: |
        Writes a `pending` decoy and a `decoy.create` job for a host agent to
        lease. Draft entries need `allow_draft: true` and `decoys:elevate`.
        Deprecated entries and Docker-runtime entries are refused. Every
        decoy inherits deny-by-default egress (#4). Rate limited per principal
        (default 10 an hour) and capped per tenant (default 5 live decoys).
      x-foiled-status: implemented
      x-foiled-store: d1
      x-foiled-scopes: [decoys:write]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateDecoy" }
      responses:
        "201":
          description: Accepted; the decoy is pending until a host reports.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobAccepted" }
        "200":
          description: A retry with the same `Idempotency-Key`; returns the original decoy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobAccepted" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorised" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v0/decoys/{decoy_id}:
    get:
      tags: [decoys]
      operationId: getDecoy
      summary: Get a decoy
      x-foiled-status: implemented
      x-foiled-store: d1
      x-foiled-scopes: [decoys:read]
      parameters:
        - $ref: "#/components/parameters/DecoyId"
      responses:
        "200":
          description: The decoy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Decoy" }
        "401": { $ref: "#/components/responses/Unauthorised" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v0/decoys/{decoy_id}:stop:
    $ref: "#/components/pathItems/DecoyAction"
  /v0/decoys/{decoy_id}:rotate:
    $ref: "#/components/pathItems/DecoyAction"
  /v0/decoys/{decoy_id}:reset:
    $ref: "#/components/pathItems/DecoyAction"
  /v0/decoys/{decoy_id}:mark-compromised:
    $ref: "#/components/pathItems/DecoyAction"
  /v0/decoys/{decoy_id}:destroy:
    $ref: "#/components/pathItems/DecoyAction"

  /v0/hosts/{host_id}/heartbeat:
    post:
      tags: [hosts]
      operationId: hostHeartbeat
      summary: Sandbox host health report
      description: Host health, KVM present, public exposure, free disk, running decoys, agent version and buffer counters. The control plane records clock skew from `host_time` (#41).
      security: [{ mtls: [] }]
      x-foiled-status: implemented
      x-foiled-store: d1
      x-foiled-scopes: [host:report]
      parameters:
        - $ref: "#/components/parameters/HostId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../schemas/agent/heartbeat.schema.json" }
      responses:
        "204": { description: "Recorded." }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorised" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v0/hosts/{host_id}/jobs:lease:
    post:
      tags: [hosts]
      operationId: leaseJobs
      summary: Lease signed jobs for this host
      description: |
        Returns up to `max` jobs placed on this host (or not yet placed, which
        this lease places here), each signed with the control plane's Ed25519
        key and carrying an idempotency key, `reason` and expiry. Leases last
        5 minutes; a lapsed lease can be taken again by the same host. A host
        certificate can only lease its own jobs (#41).
      security: [{ mtls: [] }]
      x-foiled-status: implemented
      x-foiled-store: d1
      x-foiled-scopes: [host:lease]
      parameters:
        - $ref: "#/components/parameters/HostId"
        - { name: max, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 10 } }
      responses:
        "200":
          description: Zero or more signed jobs.
          content:
            application/json:
              schema:
                type: object
                required: [jobs, lease_expires_at]
                properties:
                  jobs:
                    type: array
                    items: { $ref: "../schemas/agent/signed-job.schema.json" }
                  lease_expires_at: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorised" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503":
          description: Job signing is not configured.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v0/hosts/{host_id}/jobs/{job_id}:ack:
    post:
      tags: [hosts]
      operationId: ackJob
      summary: Report a job result
      description: |
        Closes a job leased by this host. A reported `decoy_state` is applied
        by walking the allowed transitions (`docs/rotation.md`); a successful
        rotate or reset always passes through `rotating` and bumps the
        generation. Impossible states are refused with 409. Audited as
        `job.ack`.
      security: [{ mtls: [] }]
      x-foiled-status: implemented
      x-foiled-store: d1
      x-foiled-scopes: [host:report]
      parameters:
        - $ref: "#/components/parameters/HostId"
        - { name: job_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../schemas/agent/job-result.schema.json" }
      responses:
        "204": { description: "Recorded." }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorised" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v0/uploads:
    post:
      tags: [ingest]
      operationId: mintUploadUrl
      summary: Mint a short-lived R2 upload URL for one evidence object
      description: |
        Pcaps, file diffs, quarantined payloads and large request slices go
        straight to R2 and never through a Worker request body. The presigned
        PUT is scoped to one object key under the caller's tenant and decoy,
        carries the object's SHA-256 as a signed `x-amz-checksum-sha256`
        header (R2 rejects a body that does not match), and expires in
        minutes. Only decoys assigned to the calling host or sensor (#9).
      security: [{ mtls: [] }]
      x-foiled-status: implemented
      x-foiled-store: r2
      x-foiled-scopes: [host:upload, sensor:upload]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UploadRequest" }
      responses:
        "201":
          description: Upload URL, required headers and the `payload_ref` to cite in events.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadGrant" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorised" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503":
          description: Uploads are not configured on this deployment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v0/ingest/events:
    post:
      tags: [ingest]
      operationId: ingestEvents
      summary: Submit a batch of capture envelopes
      description: |
        1 to 100 envelopes, each validated against
        `schemas/capture-event.schema.json` and the core checks (size, time,
        IPs, hook channel, payload references under the caller's own tenant
        and decoy). Any invalid event rejects the batch. Accepted events are
        stamped with the certificate identity (claimed `source` and
        `tenant_id` are replaced) and put on the ingest Queue (#9, #31).
      security: [{ mtls: [] }]
      x-foiled-status: implemented
      x-foiled-store: queue
      x-foiled-scopes: [host:ingest, sensor:ingest]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [events]
              properties:
                events:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: { $ref: "../schemas/capture-event.schema.json" }
      responses:
        "202":
          description: Queued.
          content:
            application/json:
              schema:
                type: object
                required: [accepted]
                properties:
                  accepted: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorised" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /v0/sensors:
    get:
      tags: [sensors]
      operationId: listSensors
      summary: Edge sensor enrolment status
      x-foiled-status: planned
      x-foiled-issue: 31
      x-foiled-store: d1
      x-foiled-scopes: [sensors:read]
      responses:
        "200": { description: "Sensors for the tenant." }

  /v0/attempts:
    get:
      tags: [attempts]
      operationId: listAttempts
      summary: List exploit attempts
      description: |
        Built on request from the capture events in a window (default the
        last 7 days, at most 31 days and 20,000 events) with the
        deterministic grouping in `docs/attempts.md`. Newest activity first.
        `truncated` is true when the window held more events than the cap.
      parameters:
        - { name: since, in: query, schema: { type: integer }, description: "Unix ms, inclusive." }
        - { name: until, in: query, schema: { type: integer }, description: "Unix ms, exclusive." }
        - { name: decoy_id, in: query, schema: { type: string } }
        - { name: decoy_kind, in: query, schema: { $ref: "#/components/schemas/DecoyKind" } }
        - { name: sensor_id, in: query, schema: { type: string } }
        - { name: src, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string, enum: [probe, exploit, post-exploitation] } }
        - { name: cve, in: query, schema: { type: string }, description: "Case-insensitive CVE id from hook hits; CVE links (#12, #27) extend this." }
        - { name: campaign_id, in: query, schema: { type: string } }
        - { name: technique, in: query, schema: { type: string, pattern: "^T[0-9]{4}(\\.[0-9]{3})?$" }, description: "ATT&CK technique id. Matches attempts with a technique link to it (#26, #27)." }
        - { name: min_confidence, in: query, schema: { type: integer, minimum: 0, maximum: 100 }, description: "Matches attempts with a CVE or technique link (or, with `technique`, that link) scoring at least this. Scores are before analyst overrides." }
        - { $ref: "#/components/parameters/Limit" }
      x-foiled-status: implemented
      x-foiled-store: postgres
      x-foiled-scopes: [attempts:read]
      responses:
        "200":
          description: Attempts.
          content:
            application/json:
              schema:
                type: object
                required: [items, truncated]
                properties:
                  items:
                    type: array
                    items: { $ref: "../schemas/attempt.schema.json" }
                  truncated: { type: boolean }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorised" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v0/attempts/{attempt_id}:
    get:
      tags: [attempts]
      operationId: getAttempt
      summary: Get one attempt
      description: Attempt ids are stable for the same evidence. Pass the same `since` and `until` as the list call for attempts older than 7 days.
      x-foiled-status: implemented
      x-foiled-store: postgres
      x-foiled-scopes: [attempts:read]
      parameters:
        - { $ref: "#/components/parameters/AttemptId" }
        - { name: since, in: query, schema: { type: integer } }
        - { name: until, in: query, schema: { type: integer } }
      responses:
        "200":
          description: The attempt.
          content:
            application/json:
              schema: { $ref: "../schemas/attempt.schema.json" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [attempts]
      operationId: patchAttempt
      summary: Label, merge or split an attempt (audited, never deletes raw events)
      x-foiled-status: planned
      x-foiled-issue: 25
      x-foiled-store: postgres
      x-foiled-scopes: [attempts:write]
      parameters: [{ $ref: "#/components/parameters/AttemptId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200": { description: "Updated." }

  /v0/attempts/{attempt_id}/timeline:
    get:
      tags: [attempts]
      operationId: getAttemptTimeline
      summary: Ordered timeline of capture events for an attempt
      description: |
        Read-only (`docs/attempt-timeline.md`). Events in time order with
        offsets, state changes, payload and IOC refs, and a pcap extract
        recipe. Summaries escape control, bidi and line-break characters.
        `format=text` returns the plain-text rendering. Pass the same
        `since` and `until` as the list call for attempts older than 7 days.
      x-foiled-status: implemented
      x-foiled-store: postgres
      x-foiled-scopes: [attempts:read]
      parameters:
        - { $ref: "#/components/parameters/AttemptId" }
        - { name: since, in: query, schema: { type: integer } }
        - { name: until, in: query, schema: { type: integer } }
        - { name: format, in: query, schema: { type: string, enum: [json, text], default: json } }
      responses:
        "200":
          description: Timeline.
          content:
            application/json:
              schema: { $ref: "../schemas/attempt-timeline.schema.json" }
            text/plain:
              schema: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorised" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v0/attempts/{attempt_id}/links:
    get:
      tags: [attempts]
      operationId: getAttemptLinks
      summary: CVE and ATT&CK links with confidence, evidence and wording
      description: |
        Scored with the confidence layer (`docs/confidence.md`): every
        evidence item, every contribution and every cap is listed. Wording is
        "we assess as" until an analyst confirms. Actor and campaign links
        arrive with #29 and #33.
      x-foiled-status: implemented
      x-foiled-store: postgres
      x-foiled-scopes: [attempts:read]
      parameters:
        - { $ref: "#/components/parameters/AttemptId" }
        - { name: since, in: query, schema: { type: integer } }
        - { name: until, in: query, schema: { type: integer } }
      responses:
        "200":
          description: Links.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "../schemas/confidence-link.schema.json" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [attempts]
      operationId: overrideAttemptLink
      summary: Analyst override or feedback on a link (audited)
      description: "`true_positive` confirms (score 100, wording confirmed), `false_positive` suppresses, `unsure` records feedback without changing the score. Written to the audit log as `link.override`."
      x-foiled-status: implemented
      x-foiled-store: postgres
      x-foiled-scopes: [attempts:write]
      parameters:
        - { $ref: "#/components/parameters/AttemptId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [kind, target, feedback, note]
              properties:
                kind: { type: string, enum: [attempt_cve, attempt_technique, attempt_actor, attempt_campaign] }
                target: { type: string }
                feedback: { type: string, enum: [true_positive, false_positive, unsure] }
                note: { type: string, maxLength: 1000 }
      responses:
        "200":
          description: The link as it now scores.
          content:
            application/json:
              schema: { $ref: "../schemas/confidence-link.schema.json" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v0/campaigns:
    get:
      tags: [intel]
      operationId: listCampaigns
      summary: List campaigns
      x-foiled-status: planned
      x-foiled-issue: 33
      x-foiled-store: postgres
      x-foiled-scopes: [campaigns:read]
      responses:
        "200": { description: "Campaigns." }

  /v0/campaigns/{campaign_id}:
    get:
      tags: [intel]
      operationId: getCampaign
      summary: Get a campaign
      x-foiled-status: planned
      x-foiled-issue: 33
      x-foiled-store: postgres
      x-foiled-scopes: [campaigns:read]
      parameters:
        - { name: campaign_id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "The campaign." }

  /v0/iocs:
    get:
      tags: [intel]
      operationId: searchIocs
      summary: Search IOCs
      parameters:
        - { name: type, in: query, schema: { type: string } }
        - { name: value, in: query, schema: { type: string } }
        - { name: attempt_id, in: query, schema: { type: string } }
        - { name: campaign_id, in: query, schema: { type: string } }
      x-foiled-status: planned
      x-foiled-issue: 34
      x-foiled-store: postgres
      x-foiled-scopes: [iocs:read]
      responses:
        "200": { description: "Matching IOCs." }

  /v0/review-queue:
    get:
      tags: [review]
      operationId: listReviewQueue
      summary: Analyst review queue
      x-foiled-status: planned
      x-foiled-issue: 35
      x-foiled-store: postgres
      x-foiled-scopes: [review:read]
      responses:
        "200": { description: "Queue items." }

  /v0/review-queue/{item_id}:
    get:
      tags: [review]
      operationId: getReviewItem
      summary: Get a review queue item
      x-foiled-status: planned
      x-foiled-issue: 35
      x-foiled-store: postgres
      x-foiled-scopes: [review:read]
      parameters:
        - { name: item_id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "The item." }
    patch:
      tags: [review]
      operationId: actOnReviewItem
      summary: Confirm, reject, snooze or promote (audited)
      x-foiled-status: planned
      x-foiled-issue: 35
      x-foiled-store: postgres
      x-foiled-scopes: [review:write]
      parameters:
        - { name: item_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200": { description: "Updated." }

  /v0/quarantine:
    get:
      tags: [quarantine]
      operationId: listQuarantine
      summary: Quarantined payload metadata (never the bytes)
      x-foiled-status: planned
      x-foiled-issue: 9
      x-foiled-store: postgres
      x-foiled-scopes: [quarantine:read]
      responses:
        "200": { description: "Metadata." }

  /v0/quarantine/{sha256}:download:
    post:
      tags: [quarantine]
      operationId: downloadQuarantine
      summary: Mint a one-time download URL after double confirm (default off)
      x-foiled-status: planned
      x-foiled-issue: 14
      x-foiled-store: r2
      x-foiled-scopes: [quarantine:download]
      parameters:
        - { name: sha256, in: path, required: true, schema: { type: string, pattern: "^[a-f0-9]{64}$" } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "201": { description: "One-time URL." }

  /v0/exports/iocs.csv:
    get:
      tags: [exports]
      operationId: exportIocsCsv
      summary: IOC CSV export (source IPs seen at the tenant's decoys)
      description: |
        One row per source IP: `indicator_type, indicator, first_seen,
        last_seen, event_count, decoy_ids, catalogue_ids, hook_cves`. Reads
        live rows only, so data removed by the retention purge never returns
        (#16). Cells are RFC 4180 quoted and formula-safe. The richer IOC
        model (#34) and STIX, MISP and TAXII outputs (#13) build on this.
      x-foiled-status: implemented
      x-foiled-store: postgres
      x-foiled-scopes: [exports:read]
      parameters:
        - { name: since, in: query, schema: { type: integer }, description: "Unix ms. Default: 30 days ago." }
      responses:
        "200":
          description: CSV.
          content:
            text/csv:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorised" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v0/exports/stix:
    post:
      tags: [exports]
      operationId: requestStixExport
      summary: Queue a STIX 2.1 bundle export
      description: Runs on a Queue consumer; the response points at the result in R2 (#13).
      x-foiled-status: planned
      x-foiled-issue: 13
      x-foiled-store: queue
      x-foiled-scopes: [exports:read]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "202": { description: "Export queued." }

  /v0/alerts:
    get:
      tags: [alerts]
      operationId: listAlerts
      summary: Recent alerts and delivery status
      x-foiled-status: planned
      x-foiled-issue: 15
      x-foiled-store: postgres
      x-foiled-scopes: [alerts:read]
      responses:
        "200": { description: "Alerts." }

  /v0/audit:
    get:
      tags: [audit]
      operationId: listAudit
      summary: Audit log, newest first
      x-foiled-status: implemented
      x-foiled-store: postgres
      x-foiled-scopes: [audit:read]
      parameters:
        - { name: action, in: query, schema: { type: string } }
        - { name: target, in: query, schema: { type: string } }
        - { name: cursor, in: query, schema: { type: string } }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Records.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AuditRecord" }
                  next_cursor: { type: [string, "null"] }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorised" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v0/events:
    get:
      tags: [events]
      operationId: streamEvents
      summary: Live event stream (WebSocket upgrade or SSE)
      description: Served by a Durable Object with hibernating WebSockets. Clients must reconnect and backfill after deploys.
      x-foiled-status: planned
      x-foiled-issue: 14
      x-foiled-store: do
      x-foiled-scopes: [events:read]
      responses:
        "101": { description: "WebSocket upgrade." }
        "200":
          description: Server-sent events.
          content:
            text/event-stream:
              schema: { type: string }

  /v0/mcp:
    post:
      tags: [mcp]
      operationId: mcp
      summary: MCP endpoint (Streamable HTTP, JSON-RPC 2.0)
      description: |
        Model Context Protocol server for agents (#24). One JSON-RPC 2.0
        request or notification per POST; batches are refused. Requests get
        a single `application/json` response, notifications get 202 with no
        body. There is no SSE stream and no session (`GET` and `DELETE`
        answer 405). Serves protocol revisions `2026-07-28` (stateless,
        `server/discover`), `2025-11-25` and `2025-06-18` (`initialize`).
        Methods: `initialize`, `server/discover`, `ping`, `tools/list`,
        `tools/call`.

        The endpoint is a pure client of this API: each tool call is replayed
        against the REST routes with the caller's own token, so their scopes,
        tenancy, rate limits, caps and audit apply. Agent caps from
        `configs/mcp.yaml` apply on top. Every `tools/call` writes one
        `mcp.tool_call` audit record. Tool results put attacker text inside
        nonce-framed, escaped blocks (`../schemas/mcp-tool-result.schema.json`).
        A request with an `Origin` header not in `allowed_origins` gets 403.
      x-foiled-status: implemented
      x-foiled-store: d1
      x-foiled-scopes: [catalogue:read, decoys:read, decoys:write, decoys:elevate, attempts:read, audit:read]
      parameters:
        - name: MCP-Protocol-Version
          in: header
          description: Required on every request except `initialize` and `server/discover`. Must match `params._meta` when both are sent.
          schema: { type: string, enum: ["2026-07-28", "2025-11-25", "2025-06-18"] }
        - name: Mcp-Method
          in: header
          description: When sent, must equal the body's `method`.
          schema: { type: string }
        - name: Mcp-Name
          in: header
          description: When sent on `tools/call`, must equal `params.name`.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JsonRpcRequest" }
            examples:
              call:
                value:
                  jsonrpc: "2.0"
                  id: 1
                  method: tools/call
                  params:
                    name: query_attempts
                    arguments: { src: 203.0.113.66, state: exploit }
      responses:
        "200":
          description: A JSON-RPC response. Tool results carry `structuredContent` in the shape of `mcp-tool-result.schema.json` and the same data framed as text.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JsonRpcResponse" }
        "202":
          description: A notification was accepted. No body.
        "400":
          description: Parse error, batch, missing or unsupported protocol version, or a header that does not match the body.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JsonRpcResponse" }
        "401": { $ref: "#/components/responses/Unauthorised" }
        "403":
          description: Origin not allowed, or a host or sensor credential.
          content:
            application/json:
              schema: {}
        "404":
          description: Unknown method under protocol revision 2026-07-28 (JSON-RPC -32601), or the endpoint is switched off.
          content:
            application/json:
              schema: {}
        "413":
          description: Body over 64 KiB.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JsonRpcResponse" }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: "fo_<id>.<secret>"
      description: |
        Operator and MCP tokens. An `mcp` role token can only hold
        catalogue:read, decoys:read, decoys:write, decoys:elevate,
        attempts:read, audit:read and events:read (#24). Scopes: catalogue:read, decoys:read,
        decoys:write, decoys:elevate, attempts:read, attempts:write,
        campaigns:read, campaigns:write, iocs:read, review:read, review:write,
        sensors:read, sensors:write, hosts:read, hosts:write, quarantine:read,
        quarantine:download, exports:read, alerts:read, alerts:write,
        audit:read, events:read, admin (implies every operator scope).
    mtls:
      type: mutualTLS
      description: |
        Sandbox hosts (scopes host:lease, host:report, host:ingest,
        host:upload) and edge sensors (sensor:ingest, sensor:upload,
        sensor:heartbeat) on the ingest hostname. Verified by a WAF rule and
        again in the Worker from `cf.tlsClientAuth`.

  parameters:
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      schema: { type: string, minLength: 1, maxLength: 128 }
      description: Retries with the same key return the original result.
    DecoyId:
      name: decoy_id
      in: path
      required: true
      schema: { type: string }
    HostId:
      name: host_id
      in: path
      required: true
      schema: { type: string }
    AttemptId:
      name: attempt_id
      in: path
      required: true
      schema: { type: string }

  pathItems:
    DecoyAction:
      post:
        tags: [decoys]
        summary: Stop, rotate, reset, mark compromised or destroy a decoy
        description: |
          Writes a host agent job. A `reason` is required and audited. The
          decoy's state must allow the move (`docs/rotation.md`); otherwise
          the refusal is audited and 409 is returned.
        x-foiled-status: implemented
        x-foiled-store: d1
        x-foiled-scopes: [decoys:write]
        parameters:
          - $ref: "#/components/parameters/DecoyId"
          - $ref: "#/components/parameters/IdempotencyKey"
        requestBody:
          required: true
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [reason]
                properties:
                  reason: { $ref: "#/components/schemas/Reason" }
        responses:
          "202":
            description: Job queued.
            content:
              application/json:
                schema: { $ref: "#/components/schemas/JobAccepted" }
          "400": { $ref: "#/components/responses/BadRequest" }
          "401": { $ref: "#/components/responses/Unauthorised" }
          "403": { $ref: "#/components/responses/Forbidden" }
          "404": { $ref: "#/components/responses/NotFound" }
          "409": { $ref: "#/components/responses/Conflict" }
          "429": { $ref: "#/components/responses/RateLimited" }

  responses:
    BadRequest:
      description: Invalid input.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorised:
      description: Missing, invalid, expired or revoked credentials.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: The caller lacks the required scope.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Not found, or not visible to this tenant.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: The current state does not allow this, or the idempotency key was reused.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unprocessable:
      description: Valid JSON that breaks a rule, for example a draft entry without elevation.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: Too many requests in this window.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    JsonRpcRequest:
      type: object
      required: [jsonrpc, method]
      properties:
        jsonrpc: { const: "2.0" }
        id: { type: [string, integer], description: "Absent for notifications." }
        method: { type: string, examples: [tools/call] }
        params: { type: object }
    JsonRpcResponse:
      type: object
      required: [jsonrpc]
      properties:
        jsonrpc: { const: "2.0" }
        id: { type: [string, integer] }
        result:
          type: object
          description: For `tools/call`, `content`, `structuredContent` and `isError`.
          properties:
            content: { type: array, items: { type: object } }
            structuredContent: { $ref: "../schemas/mcp-tool-result.schema.json" }
            isError: { type: boolean }
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: integer, examples: [-32602, -32022, -32020] }
            message: { type: string }
            data: {}
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, examples: [forbidden, entry_draft, rate_limited] }
            message: { type: string }
    Health:
      type: object
      required: [status, service, version]
      properties:
        status: { type: string, const: ok }
        service: { type: string }
        version: { type: string }
    DecoyKind:
      type: string
      enum: [sandbox, emulation]
    DecoyState:
      type: string
      enum: [pending, starting, healthy, rotating, stopped, quarantined, failed, destroyed]
    ReasonCode:
      type: string
      enum: [max_lifetime, idle, reverse_shell, egress_blocked, yara_match, canary_used, honeyscore_high, health_failed, operator_manual]
    Reason:
      type: object
      additionalProperties: false
      required: [code, text]
      properties:
        code: { $ref: "#/components/schemas/ReasonCode" }
        text: { type: string, minLength: 1, maxLength: 500 }
    CatalogueEntry:
      description: See `catalogue/schema/entry.schema.json` for the full contract.
      type: object
      required: [id, product, vendor, version, decoy_kind, cves, listen_ports, sources, status, risk_notes]
      properties:
        id: { type: string }
        product: { type: string }
        vendor: { type: string }
        version: { type: string }
        decoy_kind: { $ref: "#/components/schemas/DecoyKind" }
        status: { type: string, enum: [draft, verified, deprecated] }
        cves: { type: array, items: { type: object } }
        listen_ports: { type: array, items: { type: object } }
        sources: { type: array, items: { type: string } }
        risk_notes: { type: string }
    CreateDecoy:
      type: object
      additionalProperties: false
      required: [catalogue_id]
      properties:
        catalogue_id: { type: string, examples: [foiled/demo-app/1.0.0] }
        label: { type: string, maxLength: 100 }
        lifetime_seconds: { type: integer, minimum: 1, maximum: 604800, default: 86400 }
        allow_draft: { type: boolean, default: false }
    Decoy:
      type: object
      required: [id, tenant_id, catalogue_id, decoy_kind, state, generation, created_at, updated_at, expires_at, created_by]
      properties:
        id: { type: string }
        tenant_id: { type: string }
        catalogue_id: { type: string }
        decoy_kind: { $ref: "#/components/schemas/DecoyKind" }
        label: { type: [string, "null"] }
        state: { $ref: "#/components/schemas/DecoyState" }
        host_id: { type: [string, "null"] }
        generation: { type: integer }
        created_at: { type: integer, description: "Unix ms." }
        updated_at: { type: integer, description: "Unix ms." }
        expires_at: { type: integer, description: "Unix ms after which the decoy rotates for max_lifetime." }
        created_by: { type: string }
    JobAccepted:
      type: object
      required: [decoy, job_id, job_kind]
      properties:
        decoy: { $ref: "#/components/schemas/Decoy" }
        job_id: { type: string }
        job_kind:
          type: string
          enum: [decoy.create, decoy.stop, decoy.rotate, decoy.reset, decoy.mark_compromised, decoy.destroy]
    UploadRequest:
      type: object
      additionalProperties: false
      required: [decoy_id, channel, sha256, size]
      properties:
        decoy_id: { type: string }
        attempt_id: { type: string }
        channel: { type: string, enum: [network, application, filesystem, process, quarantine, hook, dns, egress] }
        sha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        size: { type: integer, minimum: 1, maximum: 5368709120 }
    UploadGrant:
      type: object
      required: [method, url, headers, payload_ref, expires_at]
      properties:
        method: { type: string, const: PUT }
        url: { type: string, format: uri }
        headers:
          type: array
          description: Header name and value pairs the uploader must send unchanged.
          items: { type: array, items: { type: string }, minItems: 2, maxItems: 2 }
        payload_ref: { type: string, examples: ["r2://foiled-evidence/t1/dcy-1/_/network/9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08"] }
        expires_at: { type: integer, description: Unix ms. }
    AuditRecord:
      type: object
      required: [id, ts, tenant_id, actor_id, actor_kind, action, outcome]
      properties:
        id: { type: string }
        ts: { type: integer }
        tenant_id: { type: string }
        actor_id: { type: string }
        actor_kind: { type: string, enum: [human, mcp, host, sensor] }
        action: { type: string }
        target: { type: [string, "null"] }
        reason_code: { type: [string, "null"] }
        reason_text: { type: [string, "null"] }
        job_id: { type: [string, "null"] }
        idempotency_key: { type: [string, "null"] }
        outcome: { type: string, enum: [accepted, denied, failed] }
        detail: {}
