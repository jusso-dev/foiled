            application/json:
              schema: { $ref: "#/components/schemas/AgentCreated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorised" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v0/sensors/{sensor_id}/certificate:renew:
    post:
      tags: [sensors]
      operationId: renewSensorCertificate
      summary: Renew this sensor's client certificate with a new key
      description: |
        Called by the sensor itself over mTLS, with a CSR for a freshly
        generated key. The previous certificate keeps working for 24 hours
        so a lost response can be retried, then stops. Only as itself
        (403 otherwise), only while active, and rate limited (default 4 a
