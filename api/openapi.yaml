      parameters:
        - { name: sensor_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [csr_pem]
              properties:
                csr_pem: { type: string, maxLength: 8192 }
