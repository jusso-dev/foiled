      summary: Mint a new enrolment token for a sensor that lost its key
      description: |
        For a rebuilt or wiped sensor that is not suspected of compromise
        (revoke that instead). Any unused token is closed. Redeeming the new
        token retires the sensor's existing certificates immediately, with
        no grace period. Audited as `sensor.reenrol`; refused with 409 for a
