  /v0/campaigns:
    get:
      tags: [intel]
      operationId: listCampaigns
      summary: List campaigns
      description: |
        Clustered on request from the attempts in a window (default the last
        7 days, at most 31 days and 20,000 events) with the deterministic
        clustering in `docs/campaigns.md`: shared infrastructure, TTPs,
        targeting and payloads, joined through an inverted index and
