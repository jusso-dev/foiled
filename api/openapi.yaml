        "201":
          description: New certificate.
          content:
            application/json:
              schema: { $ref: "../schemas/agent/enrol-response.schema.json" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorised" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502":
          description: The certificate authority did not issue a certificate.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: Certificate issuance is not configured.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

