      summary: TAXII 2.1 objects
      description: |
        The objects `/v0/exports/stix` builds with default options
        (publishable only, TLP:AMBER), sorted by `date_added` then id.
        Each page reads events from its own position (`next`, else
        `added_after`, else 7 days ago; never more than 30 days back), at
        most 4,000 per page; a cut window answers `more: true` with a
        `next`, even on a short page. An object's `date_added` is never
        earlier than that of any object referring to it, so `added_after`
        polls never strand a reference. `added_after` is exclusive. Pages
        hold at most `limit` objects (default 100, at most 1000); follow
        `next` while `more` is true. `X-TAXII-Date-Added-First` and
        `X-TAXII-Date-Added-Last` describe the page.
