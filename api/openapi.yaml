  /v0/sensors/{sensor_id}:revoke:
    post:
      tags: [sensors]
      operationId: revokeSensor
      summary: Revoke a sensor and every certificate it holds
      description: |
        Final. Marks the sensor and all of its certificates revoked in D1 (the
        Worker refuses them from this request on), closes any unused
        enrolment token, then revokes each certificate at the
        Cloudflare-managed CA so the WAF rule's `cert_revoked` check blocks it
        at the edge. `ca_failed` counts certificates the CA did not revoke
        (their fingerprints are in the audit record's `revoke_in_dashboard`);
