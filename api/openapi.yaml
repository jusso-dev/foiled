  /v0/write-ups/{writeup_id}/transitions:
    post:
      tags: [review]
      operationId: transitionWriteUp
      summary: Submit, send back, approve, reopen, publish or withdraw (audited)
      description: |
        Allowed moves: draft to review, review to draft (needs a note),
        review to approved, approved to draft, approved to published,
        published to withdrawn. Submit, approve and publish need a clean
        lint (`lint_failed`). Approve needs a reviewer who is not the author
        and did not create, edit or submit it since it was last approved
        (`second_reviewer`) and every checklist item (`checklist_incomplete`).
        Publish and withdraw need `review:publish` and a publisher tenant
        (`PUBLISHER_TENANTS`); publish needs TLP:CLEAR (`tlp`), a slug no
        other published write-up holds (409), and a snapshot free of tenant
        data (`tenant_data`). The version check comes before the public page
        is written, so a request that loses a race changes nothing; pages
        are stored by version and purged from caches on publish and
        withdrawal. The public page is visible from the later of publish and
        `embargo_until`. Audited as `writeup.<status>`.
      x-foiled-status: implemented
      x-foiled-store: postgres
      x-foiled-scopes: [review:write, review:publish]
      parameters:
        - { $ref: "#/components/parameters/WriteUpId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [to]
              properties:
                to: { type: string, enum: [draft, review, approved, published, withdrawn] }
                expected_version: { type: integer, minimum: 1 }
                note: { type: string, maxLength: 1000 }
                checklist:
                  type: object
                  additionalProperties: false
                  required: [tenant_data_removed, wording_checked, no_exploit_code, payloads_redacted, sources_linked, delay_rules_checked]
                  properties:
                    tenant_data_removed: { type: boolean }
                    wording_checked: { type: boolean }
                    no_exploit_code: { type: boolean }
                    payloads_redacted: { type: boolean }
                    sources_linked: { type: boolean }
                    delay_rules_checked: { type: boolean }
      responses:
        "200":
          description: The write-up after the move.
          content:
            application/json:
              schema: { $ref: "../schemas/write-up.schema.json" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorised" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
