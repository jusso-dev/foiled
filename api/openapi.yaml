  /v0/exports/stix:
    get:
      tags: [exports]
      operationId: exportStix
      summary: STIX 2.1 bundle download
      description: |
        A deterministic STIX 2.1 bundle: indicators with patterns,
        observables, observed-data per attempt, sightings, vulnerability and
        attack-pattern objects with relationships carrying `confidence`
        from #27 and "we assess as" wording, under a TLP 2.0 marking.
        Built on request from the same window as `/v0/attempts` (default
        the last 7 days, at most 31 days); nothing is stored. One request
        reads at most 4,000 capture events, oldest first; when the window
        held more, `x-foiled-truncated` is `true` and `x-foiled-next-cursor`
        is the `cursor` to continue from (same `until`). The cursor is the
        last event read in `(ts, event_id)` order, so parts never overlap
        or skip, even within one millisecond. Only
        publishable links and IOCs leave unless `include_unreviewed` is set
        by a caller that also holds `review:write`; that export is audited
        and marked TLP:AMBER+STRICT or stricter. See
        `docs/intel-outputs.md`.
      x-foiled-status: implemented
      x-foiled-store: postgres
      x-foiled-scopes: [exports:read]
      parameters:
        - { $ref: "#/components/parameters/ExportSince" }
        - { $ref: "#/components/parameters/ExportUntil" }
        - { $ref: "#/components/parameters/ExportMinConfidence" }
        - { $ref: "#/components/parameters/ExportCatalogueId" }
        - { $ref: "#/components/parameters/ExportState" }
        - { $ref: "#/components/parameters/ExportCampaignId" }
        - { $ref: "#/components/parameters/ExportDecoyKind" }
        - { $ref: "#/components/parameters/ExportIncludeUnreviewed" }
        - { $ref: "#/components/parameters/ExportIncludeActors" }
        - { $ref: "#/components/parameters/ExportIncludePayloads" }
        - { $ref: "#/components/parameters/ExportTlp" }
        - { $ref: "#/components/parameters/ExportCursor" }
      responses:
        "200":
          description: The bundle. `x-foiled-truncated` says whether the window held more events than the cap.
          content:
            application/stix+json;version=2.1:
              schema: { $ref: "../schemas/stix-bundle.schema.json" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorised" }
        "403": { $ref: "#/components/responses/Forbidden" }

