        - { name: sensor_id, in: query, schema: { type: string } }
        - { name: decoy_id, in: query, schema: { type: string } }
        - { name: cve, in: query, schema: { type: string }, description: "Case-insensitive CVE id among the campaign's CVEs." }
        - { name: ioc_id, in: query, schema: { type: string }, description: "An IOC shared by at least two members (#34)." }
        - { name: min_confidence, in: query, schema: { type: integer, minimum: 0, maximum: 100 } }
        - { name: include, in: query, schema: { type: string, enum: [actors] }, description: "actors: fill suggested_actor_links (#29)." }
