# Redis 7.0.11 persona for the redis emulator plug-in (#30, docs/adr/0006-emulation-plugins.md).
# An unauthenticated Redis on a Debian 12 server, as the Debian package installs it, with
# bind and protected mode opened up by its operator. Schema: schemas/emulator-profile.schema.json.
#
# CVE-2099-0001 is a placeholder id used to show how a claim is wired to a hook. It is not a
# real CVE and no real Redis vulnerability is asserted here.
# Values below are synthetic. Canary values (#17) are rendered in per decoy at start.
schema_version: 1
id: redis-7.0
emulator_id: redis
plugin: redis
description: >-
  Redis 7.0.11 standalone on Debian 12 (bookworm), no password, protected configs and the
  MODULE command enabled. Answers a small command subset with Redis 7.0 reply text.
catalogue_ids:
  - emulator/redis/7.0
listen:
  - port: 6379
    protocol: tcp
    service: redis
tls: none
jitter:
  min_ms: 1
  max_ms: 12
claimed_cves:
  - cve_id: CVE-2099-0001
    claim: illustrative
    hook: redis.config-set-persistence
    notes: >-
      Illustrative only. Stands for the unauthenticated persistence-path rewrite pattern
      (CONFIG SET dir/dbfilename, then SET and SAVE). Not tied to a matcher or harness.
hooks:
  - id: redis.config-set-persistence
    stage: trigger
    cve_id: CVE-2099-0001
    severity: high
    on:
      command: CONFIG SET
      arg: dir|dbfilename
    description: Persistence path rewrite, the first step of the cron line or SSH key write technique.
  - id: redis.module-load
    stage: trigger
    severity: high
    on:
      command: MODULE LOAD
    description: Attempt to load a shared object. Always refused; nothing is loaded.
  - id: redis.replicaof
    stage: trigger
    severity: high
    on:
      command: SLAVEOF|REPLICAOF
    description: Rogue master replication, used to push a module file. Logged; no connection is made.
canaries:
  - name: billing_api_key
    kind: api_key
    description: An API key left in the cache by the billing worker.
fingerprint_checks:
  - item: FR-01
    result: pass
    note: No hostname in INFO; no tool, project or honeypot words in any reply. Asserted by tests.
  - item: FR-05
    result: pass
    note: INFO redis_version matches the catalogue entry's banner_hints exactly. Asserted by tests.
  - item: FR-06
    result: pass
    note: >-
      os, gcc_version, executable and config_file match the Debian 12 redis-server package, the
      same release as the Cowrie debian-openssh persona. Asserted by tests.
  - item: FR-07
    result: accepted_tell
    note: The emulator serves one port. Publish it next to an SSH decoy; the service mix is a placement choice.
  - item: FR-08
    result: pass
    note: Linux persona on the host's Linux TCP/IP stack.
  - item: FR-10
    result: pass
    note: >-
      Redis analogue of the error page check: unknown command, wrong arity, NOAUTH, WRONGPASS,
      protocol errors and MODULE LOAD failures use Redis 7.0 wording. Asserted by tests.
  - item: FR-11
    result: pass
    note: Uptime starts 2 to 40 days in and moves with the clock; server_time_usec is the host clock. Asserted by tests.
  - item: FR-17
    result: pass
    note: Replies wait 1 to 12 ms. Pipelined commands share one delay per read.
  - item: FR-19
    result: pass
    note: REPLICAOF is acknowledged and INFO shows master_link_status:down, as a firewalled replica would.
redis:
  version: 7.0.11
  commands:
    - AUTH
    - BGSAVE
    - COMMAND
    - CONFIG
    - DBSIZE
    - ECHO
    - FLUSHALL
    - GET
    - INFO
    - KEYS
    - MODULE
    - PING
    - QUIT
    - REPLICAOF
    - SAVE
    - SELECT
    - SET
    - SLAVEOF
  uptime_offset_s:
    min: 172800
    max: 3456000
  idle_timeout_s: 300
  info:
    - section: Server
      fields:
        - "redis_version:7.0.11"
        - "redis_git_sha1:00000000"
        - "redis_git_dirty:0"
        - "redis_build_id:6a2b4c7d9e1f3a5b"
        - "redis_mode:standalone"
        - "os:Linux 6.1.0-18-amd64 x86_64"
        - "arch_bits:64"
        - "monotonic_clock:POSIX clock_gettime"
        - "multiplexing_api:epoll"
        - "atomicvar_api:c11-builtin"
        - "gcc_version:12.2.0"
