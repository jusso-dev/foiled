name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: foiled
          POSTGRES_PASSWORD: foiled-ci-only
          POSTGRES_DB: foiled_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U foiled" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      FOILED_TEST_PG_URL: postgres://foiled:foiled-ci-only@localhost:5432/foiled_test
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # --include-ignored runs the Postgres tests against the service above.
      - run: cargo test --workspace --locked -- --include-ignored

  wasm:
    name: Rust (wasm32 Worker build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm32
      - run: cargo clippy -p foiled-api -p foiled-core --target wasm32-unknown-unknown --locked -- -D warnings
      - run: cargo build -p foiled-api --target wasm32-unknown-unknown --release --locked

  web:
    name: Front end (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm lint:openapi
        env:
          REDOCLY_TELEMETRY: "off"
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  data:
    name: Docs and schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: lint
      - name: Validate JSON Schemas and catalogue entries
        run: cargo run -p foiled-lint --locked -- .
      - name: Demo app unit tests
        run: python3 -m unittest discover -s build/recipes/foiled-demo-app/app -v
      - name: Check nftables ruleset syntax
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nftables
          sudo nft -c -f configs/nftables/honeypot.nft
      - name: Check internal Markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --include-fragments './**/*.md'
          fail: true

  demo-image:
    name: Demo image (reproducible build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - name: Build twice and compare digests
        run: |
          set -euo pipefail
          recipe=build/recipes/foiled-demo-app
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          "$recipe/build.sh"
          first="$(cat build/output/foiled-demo-app.digest)"
          rm -rf build/output
          docker buildx prune --all --force >/dev/null
          "$recipe/build.sh"
          second="$(cat build/output/foiled-demo-app.digest)"
          echo "first:  $first"
          echo "second: $second"
          test -n "$first"
          test "$first" = "$second"

  mvp-lab:
    name: MVP lab walkthrough (Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: mvp-lab
      - uses: docker/setup-buildx-action@v4
      - name: Run scripts/mvp-lab.sh
        run: scripts/mvp-lab.sh
