# sources.lock for the foiled-demo-app recipe (#6).
#
# The demo app is in-repo MIT code, so there are no upstream URLs to fetch. This
# file instead pins the sha256 of every application source that is copied into
# the image. build.sh verifies these hashes before it builds, so a tampered or
# accidentally edited source fails the build loudly.
#
# Format is `shasum -a 256 -c` compatible: "<sha256>  <path>", paths relative to
# this recipe directory. Regenerate with:
#   shasum -a 256 app/server.py > sources.lock.new   (then review and update)
cc0273d3c285c091cd50b9dd83618074444db8111fa01a7da8a55e6b832cff87  app/server.py
1b84f3ef1cca45817ebf1057586d079009a2c0ef2cc92b667c692765356de502  app/test_app.py
