[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/jusso-dev/foiled"
rust-version = "1.88"

[workspace.dependencies]
axum = { version = "0.8.9", default-features = false, features = ["json", "query", "matched-path"] }
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower = { version = "0.5", default-features = false, features = ["util"] }
tokio = { version = "1", features = ["macros", "rt"] }
worker = { version = "0.8.7", features = ["http", "axum"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
