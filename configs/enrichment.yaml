# Enrichment (#11). Design: docs/enrichment.md.
# Validated by schemas/enrichment-config.schema.json (foiled-lint) and
# bundled into the API Worker at build time: a change needs a redeploy.
#
# External intel comes from one hub, ThreatSieve, the operator's own threat
# intel platform, over a Cloudflare service binding. ThreatSieve holds the
# per-source data (GreyNoise, CISA KEV, FIRST EPSS and so on) and says per
# answer whether each source may be redistributed or used commercially.
# Foiled keeps anything restricted out of exports and away from other
# tenants (docs/compliance/licence-register.md). The key is a Worker secret
# (wrangler secret put THREATSIEVE_API_KEY); only its NAME goes here.

version: 1

# Queue fed by the ingest consumer. The enrichment consumer reads from it.
queue: foiled-enrich

cache:
  # D1 holds cache rows, rate limit counters and failure backoff.
  store: d1
  # Used when a provider answers but knows nothing about the observable.
  negative_ttl_secs: 21600
  # Wait before asking a provider again after an error or a rate limit.
  error_backoff_secs: 300

# When false, Facts from third-party providers are left out of API
# responses. Shown regardless: local_asn, yara, ThreatSieve answers whose
# every source allows redistribution and commercial use, and a tenant's own
# restricted ThreatSieve answers (to that tenant only).
show_to_tenants: false

providers:
  # Local IP-range-to-ASN and country table. No network calls. Does nothing
  # until the operator downloads a dataset, converts it to
  # start_ip,end_ip,asn,org,country CSV and uploads it to R2 at dataset_key.
  # The dataset is never committed to this repository.
  local_asn:
    enabled: true
    observables: [ip]
    dataset_key: enrichment/asn.csv
    ttl_secs: 604800

  # ThreatSieve lookup hub: POST /v1/lookup over the service binding named
  # in binding, with the key from api_key_env as a bearer token (scope
  # intel:read). Off until the binding and the secret exist.
  threatsieve:
    enabled: false
    observables: [ip, domain, url, sha256, cve]
    binding: THREATSIEVE
    api_key_env: THREATSIEVE_API_KEY
    include: [reputation, network, cve, relationships]
    # Upper bound; ThreatSieve's own ttl_seconds wins when shorter.
    ttl_secs: 86400
    # Observables per lookup (at most 500).
    batch_size: 500
    # Lookups, not observables, per minute and per day.
    rate_limit:
      per_minute: 30
      per_day: 5000
