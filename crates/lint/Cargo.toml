[package]
name = "foiled-lint"
description = "Validates Foiled schemas, catalogue entries and config files against their JSON Schemas"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
anyhow = "1"
foiled-core = { path = "../core" }
foiled-yaml = { path = "../yaml" }
jsonschema = { version = "0.60", default-features = false }
serde_json.workspace = true
walkdir = "2"

[dev-dependencies]
serde.workspace = true
tempfile = "3"

[lints]
workspace = true
