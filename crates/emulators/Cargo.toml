[package]
name = "foiled-emulators"
description = "Foiled emulation plug-ins (#30): the plug-in trait, profiles, the capture EventSink and the Redis and HTTP portal emulators"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
foiled-core = { path = "../core" }
hex = "0.4"
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng = "0.10"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt", "net", "io-util", "time", "sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time", "sync"] }

[lints]
workspace = true
